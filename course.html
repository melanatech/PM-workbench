<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PM Workbench — The Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#17221c;--ink-soft:#4a5850;--paper:#f4f6f2;--card:#fff;--ledger:#1e6b4e;--ledger-soft:#e3f0e9;
--amber:#b57116;--amber-soft:#f7ecdb;--line:#dde3dc;--term-bg:#101613;--term-line:#243029;--term-txt:#cfe4d6;
--term-green:#7bd8a8;--term-dim:#7d938a;--term-amber:#e2b46b;--red:#b3402e;--red-soft:#f7e3df;--blue:#2b4a8f;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;font-size:15.5px}
h1,h2,h3,h4,.sg{font-family:'Space Grotesk',sans-serif}
code,pre,.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
code{background:#e9ede8;border-radius:4px;padding:1px 5px;font-size:.88em}
button{font-family:inherit}
header{position:sticky;top:0;z-index:50;background:rgba(244,246,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{font-family:'Space Grotesk';font-weight:700;font-size:16px;white-space:nowrap;cursor:pointer}
.brand span{color:var(--ledger)}
.pbar{flex:1;height:6px;background:var(--line);border-radius:3px;min-width:50px;overflow:hidden}
.pbar>div{height:100%;width:0%;background:var(--ledger);transition:width .5s}
.plab{font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
.os-toggle{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.os-toggle button{border:0;background:none;padding:5px 12px;font:600 12.5px 'IBM Plex Sans';cursor:pointer;color:var(--ink)}
.os-toggle button.active{background:var(--ink);color:#fff}
.wsbtn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:600 13px 'IBM Plex Sans';cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.wsbtn:hover{background:var(--ledger)}
.wsbtn .badge{background:var(--ledger);border-radius:10px;padding:0 8px;font-size:11px;transition:transform .3s}
.wsbtn .badge.pop{transform:scale(1.4)}
[data-os]{display:none}
body.mac [data-os="mac"]{display:revert}
body.win [data-os="win"]{display:revert}
main{max-width:840px;margin:0 auto;padding:28px 18px 60px}
.view{display:none}.view.active{display:block;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font:600 11.5px 'IBM Plex Mono';letter-spacing:.13em;text-transform:uppercase;color:var(--ledger);margin-bottom:8px}
.view h1{font-size:clamp(25px,4.3vw,36px);line-height:1.14;letter-spacing:-.02em;margin-bottom:12px}
.view h2{font-size:21px;margin:30px 0 8px;letter-spacing:-.01em}
.view h3{font-size:16.5px;margin:22px 0 6px}
.view p{margin:10px 0;max-width:690px}
.lede{font-size:16.5px;color:var(--ink-soft)}
.goal{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:690px}
.goal .gi{font-size:18px}
.why{background:var(--ledger-soft);border-left:3px solid var(--ledger);border-radius:0 8px 8px 0;padding:12px 16px;margin:16px 0;font-size:14px;max-width:690px}
.warn{background:var(--amber-soft);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:12px 16px;margin:16px 0;font-size:14px;max-width:690px}
.note{font-size:13.5px;color:var(--ink-soft);max-width:690px;margin:8px 0}
pre.snip{background:var(--ink);color:#e9efe9;border-radius:8px;padding:12px 15px;font-size:12.5px;overflow-x:auto;margin:10px 0;line-height:1.6}
.footer-nav{display:flex;justify-content:space-between;align-items:center;margin-top:44px;padding-top:18px;border-top:1px solid var(--line);gap:10px}
.navb{border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:8px;padding:10px 20px;font:600 14px 'IBM Plex Sans';cursor:pointer}
.navb.primary{background:var(--ink);color:#fff}
.navb.primary:hover{background:var(--ledger);border-color:var(--ledger)}
.navb:disabled{opacity:.35;cursor:default}
.lstat{font-size:12.5px;color:var(--ink-soft)}
.lstat.ok{color:var(--ledger);font-weight:600}
.map{display:flex;flex-direction:column;gap:8px;margin:22px 0}
.map a{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;text-decoration:none;color:var(--ink);cursor:pointer}
.map a:hover{border-color:var(--ledger)}
.map .mico{font-size:19px;width:26px;text-align:center}
.map .mtitle{font-weight:600;font-size:14px}
.map .msub{font-size:12px;color:var(--ink-soft)}
.map .mdone{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:#fff;flex-shrink:0}
.map a.done .mdone{background:var(--ledger);border-color:var(--ledger)}
.scen{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:14px;margin:18px 0}
.sysdiag{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:20px 0;overflow-x:auto}
.sysdiag svg{display:block;min-width:560px;width:100%}
.tabs{display:flex;border-bottom:2px solid var(--line);margin:14px 0 0}
.tabs button{border:0;background:none;padding:9px 16px;font:600 13.5px 'IBM Plex Sans';cursor:pointer;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs button.active{color:var(--ink);border-bottom-color:var(--ledger)}
.tabpanes>div{display:none;padding:14px 0}
.tabpanes>div.active{display:block}
.step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin:12px 0;max-width:690px}
.step .shead{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.step .snum{font:700 12px 'IBM Plex Mono';color:var(--ledger)}
.step .stitle{font-weight:600;font-size:14.5px}
.step p{font-size:14px;margin:6px 0}
.branch{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.branch button{border:1.5px solid var(--ink);background:#fff;border-radius:8px;padding:8px 14px;font:600 13px 'IBM Plex Sans';cursor:pointer}
.branch button:hover{border-color:var(--ledger);color:var(--ledger)}
.branch button.picked{background:var(--ledger);border-color:var(--ledger);color:#fff}
.branchout{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:14px}
.branchout.show{display:block;animation:fadein .3s}
/* terminal */
.term{background:var(--term-bg);border-radius:var(--radius);margin:16px 0;overflow:hidden;border:1px solid var(--term-line);box-shadow:0 8px 30px rgba(16,22,19,.16)}
.term-head{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--term-line)}
.tdots{display:flex;gap:5px}.tdots i{width:9px;height:9px;border-radius:50%;background:#2c3a32}
.term-title{font:500 11.5px 'IBM Plex Mono';color:var(--term-dim);margin-left:4px}
.term-model{margin-left:auto;font:500 10.5px 'IBM Plex Mono';color:var(--term-dim);border:1px solid var(--term-line);border-radius:20px;padding:2px 9px}
.term-model.opus{color:var(--term-amber);border-color:#4a3d22}
.term-model.haiku{color:#8fc7e8;border-color:#22394a}
.term-body{padding:14px;font-family:'IBM Plex Mono';font-size:12.5px;line-height:1.65;color:var(--term-txt);min-height:44px;max-height:500px;overflow-y:auto}
.tl{white-space:pre-wrap;word-break:break-word}
.tl.user{color:#fff;font-weight:500}.tl.user::before{content:'❯ ';color:var(--term-green)}
.tl.dim{color:var(--term-dim)}.tl.log{color:var(--term-green)}.tl.flag{color:var(--term-amber)}.tl.spacer{height:8px}
.tl.del{color:#e08b7c}.tl.del::before{content:'- '}
.tl.ins{color:var(--term-green)}.tl.ins::before{content:'+ '}
.cursor{display:inline-block;width:7px;height:14px;background:var(--term-green);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.filecard{display:flex;gap:10px;align-items:center;background:#161e19;border:1px solid #2e4536;border-radius:8px;padding:9px 12px;margin:7px 0;cursor:pointer;color:var(--term-txt);font-size:12.5px}
.filecard:hover{border-color:var(--term-green)}
.filecard .fico{color:var(--term-green)}
.filecard .fview{margin-left:auto;font:600 10.5px 'IBM Plex Mono';color:var(--term-green);letter-spacing:.06em;white-space:nowrap}
.filecard.proto{border-color:#3d5a8f}.filecard.proto .fico,.filecard.proto .fview{color:#8fb4e8}
.term-foot{border-top:1px solid var(--term-line);padding:11px 13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.suggest{flex:1;min-width:180px;font-family:'IBM Plex Mono';font-size:12px;color:var(--term-dim);background:#161e19;border:1px dashed var(--term-line);border-radius:6px;padding:8px 11px;overflow-x:auto}
.suggest b{color:var(--term-txt);font-weight:500}
textarea.suggest-in,input.suggest-in{flex:1;min-width:180px;font-family:'IBM Plex Mono';font-size:12px;color:var(--term-txt);background:#161e19;border:1px dashed var(--term-green);border-radius:6px;padding:8px 11px;resize:vertical}
textarea.suggest-in{min-height:58px}
.suggest-in:focus{outline:1px solid var(--term-green)}
.runbtn{background:var(--term-green);color:var(--term-bg);border:0;border-radius:6px;padding:9px 17px;font:600 13px 'IBM Plex Sans';cursor:pointer}
.runbtn:disabled{opacity:.35;cursor:default}
.choices{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 2px}
.choices button{background:none;border:1px solid var(--term-green);color:var(--term-green);border-radius:6px;padding:7px 13px;font:500 12px 'IBM Plex Mono';cursor:pointer}
.choices button.alt{border-color:var(--term-dim);color:var(--term-dim)}
.rate{display:flex;flex-direction:column;gap:8px;max-width:520px}
.rate button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:10px 14px;font:500 13.5px 'IBM Plex Sans';cursor:pointer}
.rate button:hover{border-color:var(--ledger)}
.rate button.sel{background:var(--ledger-soft);border-color:var(--ledger);color:var(--ledger);font-weight:600}
.qanote{background:var(--card);border:1px solid var(--ledger);border-left:3px solid var(--ledger);border-radius:0 8px 8px 0;padding:13px 16px;margin:14px 0;font-size:13.5px;max-width:690px}
.hinge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0}
.hbox{border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600}
.hbox.src{background:#fff;border:1px solid var(--line)}
.hbox.contract{background:var(--ink);color:#fff}
.hbox.pp{background:#fff;border:1px solid var(--line)}
.hbox .hsub{font-weight:400;font-size:11px;color:var(--ink-soft);margin-top:2px}
.hbox.contract .hsub{color:#9db8ab}
.harrow,.hforks{color:var(--ledger);font-weight:700}
.hforks{display:flex;flex-direction:column;font-size:13px;line-height:1}
.picker{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.picker button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font:500 12.5px 'IBM Plex Sans';cursor:pointer}
.picker button:hover{border-color:var(--ledger)}
.picker button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.done-tag{font:600 10.5px 'IBM Plex Mono';color:var(--term-green);letter-spacing:.08em}
/* dashboard */
.dash{background:linear-gradient(180deg,#1b2a5e,#14204a);border-radius:10px;padding:18px 20px;color:#fff;max-width:480px;margin:14px 0}
.dash .dtitle{font-size:12px;color:#9fb0e0;letter-spacing:.05em;text-transform:uppercase}
.dash .dval{font:700 40px 'Space Grotesk';margin:2px 0}
.dash .dmeta{font-size:12px;color:#9fb0e0}
/* roadmap board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;max-width:690px}
.bcol{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:130px}
.bcol h5{font:600 11px 'IBM Plex Mono';letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;padding:0 3px}
.bcard{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:7px;padding:8px 10px;margin-bottom:7px;font-size:12.5px;transition:all .4s}
.bcard .bmeta{font:500 10.5px 'IBM Plex Mono';color:var(--ink-soft);margin-top:2px}
.bcard.f2{border-left-color:var(--amber)}
.bcard.moved{border-color:var(--ledger);background:var(--ledger-soft);animation:fadein .5s}
/* workspace drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--card);z-index:80;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:-12px 0 40px rgba(23,34,28,.18);display:flex;flex-direction:column}
.drawer.open{transform:none}
.dr-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dr-head h3{font-size:15px}
.dr-head .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink-soft)}
.dr-body{flex:1;overflow-y:auto;padding:14px 18px}
.ftree .fgroup{font:600 11px 'IBM Plex Mono';letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 6px}
.ftree .fitem{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px;font:400 12.5px 'IBM Plex Mono';cursor:pointer;background:#fff}
.ftree .fitem:hover{border-color:var(--ledger)}
.ftree .fitem .upd{margin-left:auto;font:600 10px 'IBM Plex Mono';color:var(--ledger)}
.ftree .fitem.flash{background:var(--ledger-soft);border-color:var(--ledger)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(23,34,28,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mwin{background:var(--card);border-radius:12px;width:min(740px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mhead{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.mhead .mpath{font:500 12.5px 'IBM Plex Mono';color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhead .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink-soft)}
.mbody{overflow-y:auto;padding:18px 20px;font-family:'IBM Plex Mono';font-size:12.5px;line-height:1.7;white-space:pre-wrap}
.mbody.render{font-family:'IBM Plex Sans';white-space:normal;padding:0}
/* prototype mock */
.proto-app{background:#f7f8fa;min-height:380px;padding:18px}
.pa-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pa-logo{font:700 15px 'Space Grotesk';color:var(--blue)}
.pa-nav{font-size:12px;color:#7a8699}
.pa-title{font:700 19px 'Space Grotesk';margin:4px 0 12px}
.pa-states{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pa-states button{border:1px solid #cdd4de;background:#fff;border-radius:16px;padding:5px 12px;font:500 12px 'IBM Plex Sans';cursor:pointer}
.pa-states button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pa-panel{background:#fff;border:1px solid #e2e6ec;border-radius:10px;padding:14px;box-shadow:0 2px 8px rgba(20,32,74,.05)}
.pa-row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid #eef1f5;font-size:13px}
.pa-row:last-child{border-bottom:0}
.pa-av{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:600 12px 'IBM Plex Sans'}
.pa-name{font-weight:600;min-width:120px}
.pa-bar{flex:1;height:8px;background:#eef1f5;border-radius:4px;overflow:hidden}
.pa-bar>div{height:100%;background:var(--blue)}
.pa-val{font:600 12px 'IBM Plex Mono';min-width:40px;text-align:right}
.pa-exp{border:1px solid #cdd4de;background:#fff;border-radius:6px;padding:4px 10px;font-size:11.5px;cursor:pointer}
.pa-empty{text-align:center;padding:36px 16px;color:#7a8699}
.pa-empty .pe-ic{font-size:34px}
.pa-denied{text-align:center;padding:36px 16px;color:#a3452f;background:#fdf3f0;border-radius:8px}
.pa-instr{margin-top:10px;font:500 10.5px 'IBM Plex Mono';color:#7a8699}
.pa-instr span{background:#eef1f5;border-radius:4px;padding:1px 6px;margin-right:5px;display:inline-block;margin-top:3px}
/* quiz + finale */
.quiz{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0;max-width:690px}
.quiz .q{font-weight:600;margin-bottom:9px;font-size:14.5px}
.qopts{display:flex;flex-direction:column;gap:7px}
.qopts button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 13px;font:400 13.5px 'IBM Plex Sans';cursor:pointer}
.qopts button.right{border-color:var(--ledger);background:var(--ledger-soft)}
.qopts button.wrong{border-color:var(--red);background:var(--red-soft)}
.finale-stats{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}
.fstat{background:var(--ink);color:#fff;border-radius:12px;padding:18px 22px;flex:1;min-width:170px;text-align:center}
.fstat .fv{font:700 36px 'Space Grotesk';color:var(--term-green)}
.fstat .fl{font:500 10.5px 'IBM Plex Mono';letter-spacing:.08em;text-transform:uppercase;color:#8aa596;margin-top:4px}
@media(max-width:640px){.board{grid-template-columns:1fr}}

/* ===== Illustration system: A=hand-drawn (human/capture), B=flat vector (people/stakeholder), C=geometric/abstract (structural/systemic) ===== */
.illo-wrap{display:flex;justify-content:center;margin:8px 0 4px}
.illo{width:96px;height:96px}
/* A: hand-drawn marker doodle - stroke draw-in, sized per-path so it's proportional not instant */
.illo-a path,.illo-a circle{stroke-dasharray:220;stroke-dashoffset:220;animation:illoDraw 1s ease forwards}
.illo-a .d1{stroke-dasharray:140;stroke-dashoffset:140;animation-duration:.7s}
.illo-a .d2{animation-delay:.5s;stroke-dasharray:90;stroke-dashoffset:90;animation-duration:.5s}
.illo-a .d3{animation-delay:.8s;stroke-dasharray:70;stroke-dashoffset:70;animation-duration:.45s}
.illo-a .d4{animation-delay:1.05s;stroke-dasharray:60;stroke-dashoffset:60;animation-duration:.4s}
@keyframes illoDraw{to{stroke-dashoffset:0}}
/* B: flat vector character - gentle bob */
.illo-b{animation:illoBob 2.6s ease-in-out infinite}
@keyframes illoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* C: geometric/abstract - blob drifts, ring spins slowly */
.illo-c .illo-blob{animation:illoBlob 6s ease-in-out infinite}
@keyframes illoBlob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(2px,-3px) scale(1.02)}}
.illo-c .illo-ring{transform-origin:48px 48px;animation:illoSpin 12s linear infinite}
@keyframes illoSpin{to{transform:rotate(360deg)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="mac">
<header><div class="hwrap">
  <div class="brand" onclick="goto(0)">PM<span>Workbench</span></div>
  <div class="pbar"><div id="pfill"></div></div><span class="plab" id="plab">0/11</span>
  <div class="os-toggle"><button id="osM" class="active" onclick="setOS('mac')">macOS</button><button id="osW" onclick="setOS('win')">Windows</button></div>
  <button class="wsbtn" onclick="toggleWS()">Workspace <span class="badge" id="wsbadge">10</span></button>
</div></header>
<main id="host"></main>

<div class="drawer" id="ws">
  <div class="dr-head"><h3 class="sg">Lumenly workspace — live files</h3><button class="x" onclick="toggleWS()">×</button></div>
  <div class="dr-body"><div id="wsFiles" class="ftree"></div></div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeFile()">
  <div class="mwin"><div class="mhead"><span class="mpath" id="mpath"></span><button class="x" onclick="closeFile()">×</button></div>
  <div class="mbody" id="mbody"></div></div>
</div>

<script>
/* ================= SEEDED WORKSPACE ================= */
const FILES={
"CLAUDE.md":`# CLAUDE.md — read automatically at the start of every session

## Who I am
- Product Manager at Lumenly, owning [YOUR PRODUCT AREA].
- My updates are read by [WHO READS YOUR UPDATES].

function typeLine(body,cls,text){return new Promise(res=>{
  const el=document.createElement('div');el.className='tl '+cls;body.appendChild(el);
  if(cls==='spacer'){res();return}
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=text;body.scrollTop=body.scrollHeight;res();return}
  let i=0;const cur=document.createElement('span');cur.className='cursor';el.appendChild(cur);
  const tick=()=>{if(i<text.length){el.insertBefore(document.createTextNode(text.slice(i,i+3)),cur);i+=3;body.scrollTop=body.scrollHeight;setTimeout(tick,5)}else{cur.remove();res()}};tick()})}
async function playScript(body,script){
  for(const L of script){
    if(L.t==='file'){const nb=L.body!==undefined&&L.body!==null?L.body:(OUT[L.path]!==undefined?OUT[L.path]:FILES[L.path]);setFile(L.path,nb);

      card.innerHTML=`<span class="fico">${proto?'▶':'📄'}</span><span>${L.path}</span><span class="fview">${proto?'OPEN PROTOTYPE ▸':'VIEW ▸'}</span>`;
      body.appendChild(card);body.scrollTop=body.scrollHeight;
      await new Promise(r=>setTimeout(r,240));continue}
    if(L.t==='fn'){L.x();continue}
    await typeLine(body,L.t,typeof L.x==='function'?L.x():(L.x||''));
    if(L.reg)regRow(L.reg[0],L.reg[1]);

    await typeLine(body,'user',cmd);

    if(sim.choice){renderChoices(body,foot,btn,key,typeof sim.choice==='function'?sim.choice(userText):sim.choice)}
    else fin(key,foot,btn)}}
function renderChoices(body,foot,btn,key,choiceArr){

  choiceArr.forEach(([lab,follow],i)=>{const b=document.createElement('button');b.textContent=lab;if(i>0)b.classList.add('alt');

      await playScript(body,f.script||f);
      if(f.choice)renderChoices(body,foot,btn,key,f.choice);else fin(key,foot,btn)};
    c.appendChild(b)});
  body.appendChild(c);body.scrollTop=body.scrollHeight}

research:{cmd:t=>'/research-plan silent export failures'+(t&&t.trim()?' — focus: '+t.slice(0,50):''),
 script:t=>[
  {t:'dim',x:'This does NOT look up people — your internal CRM does that. It builds the research thinking around the feature, grounded in EV-211 and the two support cases.'},
  {t:'spacer'},
  {t:'plain',x:'1 — SCREENING CRITERIA (hand these to whoever runs the CRM query):'},
  {t:'plain',x:'   Qualify: account admins at multi-location accounts (5+ locations) who ran a scheduled export in the last 30 days'},
  {t:'plain',x:'   Exclude: contacted in the last 90 days · in an active billing/support escalation · internal test accounts'},
  {t:'flag',x:'   Diversity guard: don\u2019t let the slate be 5 enterprise lookalikes — include ≥2 mid-market, ≥1 who has NOT reported the problem (to avoid only hearing from the angry). This guard is the part teams skip.'},
  {t:'spacer'},
  {t:'plain',x:'2 — OUTREACH STRATEGY + DRAFTS:'},
  {t:'plain',x:'   Sequence: CSM sends first (warm relationship), you follow up to schedule. Account owner gets a heads-up before any contact.'},
  {t:'plain',x:'   Draft (affected segment): "…your Monday export failed twice this month; that shouldn\u2019t happen silently. Could I get 20 min to make sure our fix matches how your regional review actually runs?"'},
  {t:'spacer'},
  {t:'plain',x:'3 — RESEARCH GUIDE (decision it informs: notification center vs. simple alert vs. nothing):'},
  {t:'plain',x:'   • "Walk me through the last time your export failed — how did you find out?" (tests: is silent failure the real pain, or is it the recovery?)'},
  {t:'plain',x:'   • "What did you do in the 24h after?" (tests: would an alert alone recover the workflow?)'},
  {t:'plain',x:'   • past-behavior, not hypothetical — no "would you like notifications?"'},

      <path d="M95 96 L100 101 L108 92" stroke="#1e6b4e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  };

}

function term(sim,model,suggest,edit){
  const foot=edit==='area'
    ?`<textarea class="suggest-in" rows="3">${suggest}</textarea><button class="runbtn">Run it</button>`
    :edit==='line'
    ?`<input class="suggest-in" value="${suggest.replace(/"/g,'&quot;')}"><button class="runbtn">Run it</button>`
    :`<div class="suggest">${suggest}</div><button class="runbtn">Run it</button>`;
  const mcls=model==='haiku'?' haiku':model==='opus'?' opus':'';
  const mlab=model==='haiku'?'haiku · auto':model==='opus'?'opus · auto':'sonnet';
  return `<div class="term" data-sim="${sim}"><div class="term-head"><div class="tdots"><i></i><i></i><i></i></div><span class="term-title">Claude Code — pm-workbench</span><span class="term-model${mcls}">${mlab}</span></div><div class="term-body"></div><div class="term-foot">${foot}</div></div>`}

V.l0=`<div class="eyebrow">Lesson 0</div><h1>Get it running on your machine</h1>${illo('l0')}

<div class="step"><div class="shead"><span class="snum">STEP 1</span><span class="stitle">Check for Node.js — the engine Claude Code runs on</span></div>

<pre class="snip">node --version</pre>
<div class="branch"><button onclick="branch(this,'b-ok','nodecheck')">It printed v18/v20/v22…</button><button onclick="branch(this,'b-no','nodecheck')">"command not found" / "not recognized"</button></div>

<div class="step"><div class="shead"><span class="snum">STEP 2</span><span class="stitle">Install Claude Code and sign in</span></div>

V.l1=`<div class="eyebrow">Lesson 1</div><h1>Teach it who you are — in one message</h1>${illo('l1')}

<p>Open <code>CLAUDE.md</code> in the Workspace — three <code>[BRACKETS]</code> are unfilled. That file loads at the start of every session; those brackets are the difference between output in your voice and generic filler. In real life you fill them the same way you do everything else here: tell Claude in the chat. <b>The input below is editable — put your real area, audience, and style in before running</b> (keep the three parts separated by semicolons):</p>
${term('ctx','sonnet','set up my context: I own reporting &amp; analytics; my updates go to VP Product and eng leads; keep my writing direct and brief','line')}
<div class="why"><b>The diagnostic that never stops being true:</b> if output ever sounds generic, something's missing from CLAUDE.md. The fix is another line of context — never a cleverer prompt.</div>`;

V.l2=`<div class="eyebrow">Lesson 2</div><h1>Capture a decision in under a minute</h1>${illo('l2')}

<p>Run the sample first to see the shape, then <b>clear the box and type a real decision or commitment from your own week</b> — it parses yours exactly the same way (decisions, commitments, and hedged "might/heard" risks each go to the right register).</p>
${term('quickclose','haiku','decided w/ Dana — Scorecards phase 1 admin-only, Jordan owns eligibility spec by Fri','line')}
<p class="note">Clear statements log instantly — internal bookkeeping never waits for approval; only things other people see do. Anything ambiguous is saved raw instead of guessed at, and gets fully reconciled at the nightly inbox run. Voice works too: dictate a 10-second memo<span data-os="mac"> (or your phone)</span><span data-os="win"> (Win+H, or your phone)</span> and drop the transcript in <code>inbox/meetings/</code>.</p>`;

V.l3=`<div class="eyebrow">Lesson 3</div><h1>Where the information comes from — no magic allowed</h1>${illo('l3')}

<div class="step"><div class="shead"><span class="snum">PATH 1</span><span class="stitle">Jira, Confluence, GitHub — through whatever access your company grants</span></div>
<p>Claude Code runs on <i>your</i> machine with <i>your</i> credentials. How it reaches Atlassian depends on your company's setup — one of three, and setup asks which is true for you: <b>(a)</b> an IT-enabled integration/MCP connection, <b>(b)</b> a personal API token you create in your Atlassian profile, or <b>(c)</b> none — in which case Path 2 exports cover everything, just with one manual download. It never has access you didn't give it.</p></div>
<div class="step"><div class="shead"><span class="snum">PATH 2</span><span class="stitle">Export → drop in inbox/</span></div>
<p>Any tool exports CSV/PDF. Download → drag into <code>inbox/exports/</code>. Your workspace already has three seeded ones — a Jira board export, a Slack search export, a support case. Lessons 4-5 read <i>those exact files</i> and say so.</p></div>
<div class="step"><div class="shead"><span class="snum">PATH 3</span><span class="stitle">Or just paste — the simplest one</span></div>
<p>Copy anything — a Slack thread, an email, a stray thought — and paste it into the chat. It gets classified, filed with a timestamp, and processed like everything else. Try it (editable — paste anything real):</p>
${term('paste','haiku','From #cs-escalations: Harbor Dental asked if scorecard exports can go to a shared drive instead of email. Second account asking this month.','area')}
<p class="note">That's the whole method — no special tool. For when Cursor isn't open, the workbench includes a one-click OS shortcut (a <span data-os="mac">macOS Quick Action in your right-click menu</span><span data-os="win">right-click "Send to" entry</span>) that drops your current clipboard straight into <code>inbox/</code> — so capturing never means switching apps or fiddling with a script.</p></div>
<div class="step"><div class="shead"><span class="snum">PATH 4</span><span class="stitle">The browser bridge — live reads of your logged-in tools (~15 min, once, optional)</span></div>
<p>How "reading a dashboard" becomes literal: Claude reads pages in a Chrome window <b>you're signed into</b> — read-only; clicking/typing/submitting is blocked at the permission layer.</p>
<p><b>1.</b> <code>npm install -g @playwright/mcp</code>&nbsp;&nbsp;<b>2.</b> Launch a dedicated Chrome profile (save as a shortcut):</p>
<pre class="snip"><span data-os="mac">/Applications/Google\\ Chrome.app/Contents/MacOS/Google\\ Chrome \\
  --remote-debugging-port=9222 --user-data-dir="$HOME/chrome-claude-profile"</span><span data-os="win">"C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe" ^
  --remote-debugging-port=9222 --user-data-dir="%USERPROFILE%\\chrome-claude-profile"</span></pre>
<p><b>3.</b> Log into Slack/dashboards/SharePoint in that window once — sessions persist.&nbsp;&nbsp;<b>4.</b> Create <code>.mcp.json</code> in the workbench folder:</p>
<pre class="snip">{ "mcpServers": { "browser-bridge": { "command": "npx",
  "args": ["@playwright/mcp@latest","--cdp-endpoint","http://localhost:9222"] } } }</pre>
<p><b>5.</b> Test: "using the browser-bridge, list my open tabs." Blocked by corporate policy? Paths 1-3 cover this entire course.</p></div>
<h2>Log links instead of hoarding copies</h2>
<p>For anything that lives in Confluence/SharePoint and stays reachable — templates, wiki pages, dashboards — log the link once; it's fetched live forever and can't go stale like a saved copy. Editable — use a real link of yours:</p>
${term('links','haiku','log our PRD template link: https://lumenly.atlassian.net/wiki/spaces/PROD/pages/1123/prd-template','line')}
<div class="branch"><button onclick="markDone(this,'datain')">I know how all four paths work</button></div>`;

V.l4=`<div class="eyebrow">Lesson 4</div><h1>One meeting, every follow-through</h1>${illo('l4')}

<h3>Close out the seeded roadmap review</h3>
<p>You organized it in Teams, so the transcript exists — open <code>inbox/meetings/2026-07-14-roadmap-review.txt</code> first, then watch every extraction trace to a line in it. (Didn't organize a meeting? A Copilot summary or typed notes work identically.)</p>
${term('closeout','sonnet','<b>/meeting-closeout</b> inbox/meetings/2026-07-14-roadmap-review.txt')}
<h3>Now with <i>your</i> notes</h3>
<p>The seeded transcript proves nothing if it only works on seeded files. Paste notes from a real meeting of yours (or edit the sample) — same parsing, cumulative rows:</p>
${term('yourmeeting','sonnet','Synced with Priya. Agreed to move the analytics review to monthly.\nPriya will share the instrumentation checklist by Tuesday.\nHeard the data team might lose a contractor next quarter.','area')}
<h3>Fix the board the meeting just contradicted</h3>
${term('jira','sonnet','<b>/jira-reconcile</b>')}
<h3>Friday</h3>
<p>Note what happens after the draft: it checks your <i>previous</i> commitments against this draft, and you can ask for format changes — which it remembers.</p>
${term('weekly','sonnet','<b>/weekly-update</b>')}
<div class="why"><b>Open the update file.</b> Every line traces to a register row or a source file in your workspace. Nothing was recalled from memory; everything was assembled from state — including the rows your own pasted notes just added.</div>`;

V.l5=`<div class="eyebrow">Lesson 5</div><h1>Interrogate your evidence, then pull the number</h1>${illo('l5')}

<h3>Discovery is a workbench you query — four ways</h3>
<p>Discovery isn't a "what's new" feed. It's the ongoing work of deciding what to build from evidence. The same command does four things depending on what you type — try each by editing the box:</p>
<ul class="note" style="margin:6px 0 10px 18px;list-style:disc">
<li><b>Ask across all evidence:</b> <i>"what do we know about export reliability?"</i> — searches everything, sourced, with confidence and sampling gaps called out</li>
<li><b>Add evidence:</b> paste an interview quote or note — it extracts and files it</li>
<li><b>See the delta:</b> <i>"what's new since last week?"</i></li>
<li><b>Map opportunities:</b> <i>"map opportunities around the Monday review"</i></li>
</ul>
${term('discovery','sonnet','what do we know about export reliability problems?','line')}
<div class="why"><b>Why this matters:</b> good discovery distinguishes <i>direct evidence</i> from <i>stakeholder opinion</i>, and <i>volume</i> from <i>strength</i> — three complaints from one account isn't three signals. It also names what you <i>don't</i> know. The default answer above does all three, because "we don't know enough yet" is a real, useful finding.</div>
<h3>Metrics: the number already exists</h3>
<p>Here's the (mock) dashboard. The value is right there — what ate 45 minutes a month was opening four of these, transcribing, and writing the same paragraph three ways. Note the first-run exchange: it asks where the metric lives once, and explains exactly how future reads happen (browser bridge if you set it up, a paste if you didn't):</p>
<div class="dash"><div class="dtitle">Lumenly Analytics · Weekly Active Admins</div><div class="dval">41.2%</div><div class="dmeta">target 45% · +1.8pp vs last week · data through Jul 15</div>
<svg width="260" height="46" viewBox="0 0 260 46"><polyline points="0,38 30,36 60,37 90,32 120,33 150,28 180,26 210,22 240,18 260,16" fill="none" stroke="#7bd8a8" stroke-width="2.5"/><line x1="0" y1="10" x2="260" y2="10" stroke="#5a6ba8" stroke-dasharray="4 4"/><text x="2" y="8" fill="#9fb0e0" font-size="9">target 45%</text></svg></div>
${term('okr','sonnet','<b>/okr-refresh</b>')}`;

V.l7=`<div class="eyebrow">Lesson 7</div><h1>Define the product: PRD, contract, live prototype</h1>${illo('l7')}

<p>You bring the problem, goal, and audience — a bare feature name gets refused. It brings everything the whole workspace has accumulated (and says what it set aside, so context is auditable). Runs on Opus automatically — the deep-reasoning model, saved for work like this.</p>
<div class="hinge"><div class="hbox src">Evidence · strategy · current behavior</div><div class="harrow">→</div><div class="hbox contract">Feature Contract<div class="hsub">the shared spec both sides honor</div></div><div class="hforks"><span>↙</span><span>↘</span></div><div class="hbox pp">PRD ⇄ Prototype<div class="hsub">divergence is a choice, never a silent overwrite</div></div></div>
${term('prd','opus','<b>/prd-package</b> manager scorecards — problem: owners can\u2019t see per-manager performance without hand-built exports; goal: lift weekly active admins toward 45%; audience: enterprise admins first')}
<p><b>Open all three files</b> — then use the refine choices: the problem-section rewrite produces a real v2, and the edit style is remembered.</p>
<h3>The prototype — open it, click it</h3>
<p>Built from the Feature Contract: every state the contract names becomes a screen. It can be static HTML, a real React app, or an Expo mobile app — the type is chosen up front because each runs (and gets QA'd) differently; anything beyond a single throwaway screen gets scaffolded as a real git-initialized repo, ready to import to GitHub, with a home for your company's design components or style guide if you have them.</p>

<p>In real life you open <code>index.html</code> directly, or run the dev server the README names, or open the Expo web link — or share any of those in a research session. Here, the OPEN PROTOTYPE card renders the real thing:</p>
${term('proto','sonnet','<b>/prototype-build</b> manager scorecards')}`;

V.l8=`<div class="eyebrow">Lesson 8</div><h1>Run a research loop</h1>${illo('l8')}

<h3>Turn a feature into a research plan</h3>
<p>This doesn't look up people — your internal CRM does that. It builds the <i>thinking</i>: screening criteria (with a diversity guard so you don't only hear from the angriest five), an outreach strategy with drafts, and an interview guide with decision rules written <i>before</i> sessions. Editable — narrow the focus if you like:</p>
${term('research','sonnet','recovery workflow after a failed export','line')}
<div class="why"><b>Why criteria, not a contact list:</b> the value a PM adds isn't querying a CRM — it's knowing <i>who</i> is worth talking to, <i>how</i> to reach them without leading the witness, and <i>what</i> past-behavior questions actually test the assumption. The plan is the deliverable; the CRM finds the humans.</div>
<h3>Design the test before anyone builds anything</h3>
${term('experiment','opus','<b>/experiment-package</b> failure notifications for scheduled exports')}
<div class="why"><b>The line that matters most is "IF null →".</b> The most common experiment mistake isn't bad stats — it's running a test where a null result leaves you exactly where you started. The design gate refuses those.</div>`;

V.l9=`<div class="eyebrow">Lesson 9</div><h1>Keep the roadmap coherent across every surface</h1>${illo('l9')}

<p>The roadmap doesn't live in one place — it lives in Jira, a spreadsheet, Slack updates, and a leadership deck, and drift between them is how you end up contradicting your own slide. Here's the live board (from <code>roadmap/roadmap.csv</code>):</p>
<div class="board" id="rboard">
<div class="bcol"><h5>Now</h5><div class="bcard" id="bc1">Manager Scorecards ph1<div class="bmeta">target: 2026-08 · admins</div></div></div>
<div class="bcol" id="colNext"><h5>Next</h5><div class="bcard" id="bc2">Manager Scorecards ph2<div class="bmeta">target: 2026-Q4 · per-location</div></div></div>
<div class="bcol"><h5>Later</h5><div class="bcard" id="bc3">Report scheduling v2<div class="bmeta">2027-H1</div></div></div>
</div>
<p>One input, two features — notice it splits them into separate change sets so context never blurs between initiatives, then proposes per-surface changes for each:</p>
${term('roadmap','sonnet','<b>/roadmap-update</b> scorecards ph2 slips one sprint (permissions est. now 3 wks, auth freeze); add Export Reliability to Next (case #8841, retry + failure alerts)')}
<div class="why"><b>After approving, look up:</b> the board cards changed — and the Slack draft and slide bullets are paste-ready for the surfaces only you can touch. The reason for the slip is logged with the decision, so "why did this move" stays answerable in three weeks.</div>`;

V.l6=`<div class="eyebrow">Lesson 6</div><h1>Understand a feature at the code level</h1>${illo('l6')}

<p>You have read access to the repos. This reads the relevant code and translates it into product language, with every claim tagged by confidence — the honesty that makes it safe to rely on. Editable — ask about any part of the feature:</p>
${term('codedive','sonnet','<b>/code-dive</b> scorecards permissions','line')}
<div class="why"><b>Why the confidence tags matter:</b> code proves what's <i>implemented</i>, not what's <i>deployed</i>, <i>intended</i>, or <i>strategic</i>. A tool that says "confirmed" for everything is dangerous; this one separates confirmed from inferred from "ask engineering," and turns unknowns into questions instead of guesses. Findings compound into a product-knowledge map that makes the next feature faster.</div>`;

V.l10=`<div class="eyebrow">Lesson 10</div><h1>Close delivery into strategy</h1>${illo('l10')}

<h3>Catch launch drift before you write a single doc</h3>
<p>The most expensive launch bug is documents generated from sources that already disagree. This reconciles first, drafts second:</p>
${term('launch','sonnet','<b>/launch-package</b> manager scorecards')}
<h3>Compare competitors by what changed, not by homework volume</h3>
<p>It diffs this month's captures against last month's and classifies real product changes vs. marketing rewording — then flags anything that undercuts something you're building:</p>
${term('competitive','sonnet','<b>/competitive-scan</b> reporting')}
<h3>Refresh strategy from accumulated evidence — as a change report</h3>
<p>Not a from-scratch essay. It shows what strengthened, weakened, or newly contradicts your assumptions — and note the <b>Deep-mode usage estimate</b> before it fans out, with a Standard option if you don't need the full run:</p>
${term('strategy','opus','<b>/strategy-refresh</b> reporting')}
<h3>And when a week simply blows up</h3>
${term('recover','sonnet','I haven\u2019t touched the workbench in ten days — what went stale?')}
<h3>And most days — no command at all</h3>
<p>Once state has been accumulating, you just ask. This is where the whole system pays off: everything you logged becomes answerable in one line.</p>
${term('ask','haiku','what did we decide about scorecards permissions?')}
<div class="why"><b>The loop closes here:</b> launch outcomes and competitive moves feed strategy, strategy reshapes the roadmap, the roadmap drives the next PRD. Every artifact you made in this course is a link in that chain — nothing is a dead end.</div>`;

V.l11=`<div class="eyebrow">Lesson 11</div><h1>When things go wrong</h1>${illo('l11')}

<p>A real tool earns trust by how it behaves when something breaks. Pick any failure below and watch what the workbench does — the pattern is always the same: <b>stop, name what failed, offer the fallback, never fabricate.</b></p>
<div class="picker" id="troublePicker">

<h3>Scheduling — automate only what's earned it</h3>
<p>Once a workflow is boringly reliable by hand, you can schedule it. Four modes, and the discipline that keeps scheduling from becoming a second inbox:</p>
${term('schedule','haiku','set up scheduling for my workbench')}
<div class="why"><b>The trust model in one line:</b> the system is allowed to be wrong about a lot, but it is never allowed to be <i>confidently</i> wrong. Every failure above ends in a labeled stop, not a fabricated answer — which is exactly why you can hand it real work.</div>`;

V.fin=`<div class="eyebrow">Finale</div><h1>Look at what accumulated</h1>${illo('fin')}
<p class="lede">Open the Workspace one last time — every ● updated file and register row came from the last 40 minutes, and Lesson 9 answered a question purely from them. That accumulation is the entire idea.</p>
<div class="finale-stats"><div class="fstat"><div class="fv" id="stRows">0</div><div class="fl">register rows created</div></div>
<div class="fstat"><div class="fv" id="stMins">0h</div><div class="fl">est. manual work replaced — retyping &amp; reconciling, not judgment</div></div>
<div class="fstat"><div class="fv" id="stFiles">0</div><div class="fl">documents &amp; prototypes produced, all inspectable</div></div></div>
<h2>Self-check — could you run this Monday, alone?</h2>
<p class="note">Not a quiz on product management. A check on whether you can drive the system: pick the right workflow, trust the right output, and know what to do when something breaks.</p>
<div class="quiz" data-q="1"><p class="q">1 · You just left a meeting where three things got decided and someone took an action item. You have two minutes before the next call. What do you reach for?</p><div class="qopts">
<button data-r="1">/meeting-closeout — hand it the notes or transcript, it extracts decisions, commitments, and risks and preps the downstream updates</button>
<button data-r="0">Open Jira and update tickets manually</button>
<button data-r="0">/strategy-refresh to capture the big picture</button></div></div>
<div class="quiz" data-q="2"><p class="q">2 · You need to know how a feature actually works before writing its PRD, and you don't want to interrupt an engineer. Which command — and what do you watch for in the answer?</p><div class="qopts">
<button data-r="1">/code-dive — and I check the confidence tags: confirmed vs. inferred vs. "ask engineering"</button>
<button data-r="0">/prd-package — it'll figure out the code on its own</button>
<button data-r="0">/discovery — code questions are discovery questions</button></div></div>
<div class="quiz" data-q="3"><p class="q">3 · A workflow says "Done — updated the roadmap." You open the change manifest and Jira shows applied ✓ but the spreadsheet shows pending. What's true?</p><div class="qopts">
<button data-r="1">The transaction isn't complete — I still owe the spreadsheet a paste, and the manifest is telling me exactly that</button>
<button data-r="0">It's done — Jira is the source of truth, the rest is cosmetic</button>
<button data-r="0">Something is broken and I should re-run everything</button></div></div>
<div class="quiz" data-q="4"><p class="q">4 · Mid-way through a big PRD, you hit your usage limit. How much work did you lose?</p><div class="qopts">
<button data-r="1">Almost none — it wrote a run manifest as it went, so re-running resumes where it stopped</button>
<button data-r="0">All of it — I have to start the PRD over</button>
<button data-r="0">Only the parts I hadn't saved to a file myself</button></div></div>
<div class="quiz" data-q="5"><p class="q">5 · An output reads "customers love the new flow" but you can't find evidence behind it. What should have happened, and what do you do?</p><div class="qopts">
<button data-r="1">The system should flag it as unsourced; I make it link to an evidence row or cut it — no undefended claims to stakeholders</button>
<button data-r="0">Trust it — the system doesn't make things up</button>
<button data-r="0">Rewrite the whole document from scratch</button></div></div>
<div class="ratewrap" id="ratewrap" style="display:none"><p class="q" style="margin:18px 0 8px">One honest gut-check: after this, how ready do you feel to use it on your real work?</p>
<div class="rate" id="rateBtns">
<button onclick="rateReady(1)">Not yet — I'd want a reference open</button>
<button onclick="rateReady(2)">Mostly — I'd run the daily ones confidently</button>
<button onclick="rateReady(3)">Yes — I could drive the whole thing</button></div></div>
<div class="why" id="homework" style="display:none"><b>Here's the thing about that rating:</b> the honest answer for week one is usually "mostly," and that's exactly right. You don't need all 24 commands on day one — you need the daily loop (<code>/quick-close</code>, <code>/meeting-closeout</code>, <code>/weekly-update</code>) to become reflex, and the rest to be there when the situation calls for it. <b>Your one homework move:</b> after your very next real meeting, run <code>/meeting-closeout</code>. Everything else in this course is the same three moves — capture, reconcile, produce — applied to whatever your week throws at you.</div>`;

/* ================= ROUTER & COMPLETION ================= */
let cur=0;
const MAPMETA=[
 ['🛠','Get it running on your machine','node check · Claude Code · Cursor or CLI · finding commands'],
 ['🪪','Teach it who you are','fill CLAUDE.md from the chat · see the exact diff'],
 ['⚡','Capture a decision in under a minute','/quick-close → rows in real register files'],
 ['📥','Where the information comes from','4 honest paths · paste anything · browser bridge setup'],
 ['🔁','Carry a meeting to execution','notes → state → handoff → verified Jira → update'],
 ['🔍','Answer with evidence','discovery across all evidence · official metric retrieval'],
 ['🔬','Understand a feature','product flow · docs · targeted GitHub read, confidence-tagged'],
 ['📐','Define the product','Feature Contract · PRD refinement · live prototype'],
 ['🧪','Run a research loop','slate · study · transcript · findings · experiment triage'],
 ['🗺','Keep the roadmap coherent','two initiatives · four surfaces · grouped approval'],
 ['🚢','Close delivery into strategy','launch drift · competition · strategy · recovery'],
 ['🛟','When things go wrong','12 failure modes · scheduling · why it earns trust'],
 ['🎓','Finale','what accumulated + a real readiness check']];
function render(){
  const host=document.getElementById('host');host.innerHTML='';
  ORDER.forEach((id,i)=>{const s=document.createElement('section');s.className='view'+(i===cur?' active':'');s.id='v-'+id;
    s.innerHTML=V[id]+navHTML(i);host.appendChild(s)});
  document.querySelectorAll('.term').forEach(wireTerm);
  wireQuiz();renderMap();refresh();window.scrollTo({top:0})}
function navHTML(i){
  return `<div class="footer-nav">
    <button class="navb" onclick="goto(${i-1})" ${i===0?'disabled':''}>← Back</button>
    <span class="lstat" id="ls-${ORDER[i]}"></span>
    ${i===ORDER.length-1?'<button class="navb primary" onclick="goto(0)">↺ Back to start</button>':`<button class="navb primary" onclick="goto(${i+1})">${i===0?'Start Lesson 0 →':'Next →'}</button>`}</div>`}
function goto(i){if(i<0||i>=ORDER.length)return;cur=i;
  document.querySelectorAll('.view').forEach((v,x)=>v.classList.toggle('active',x===i));
  window.scrollTo({top:0});refresh()}
function renderMap(){
  const m=document.getElementById('cmap');if(!m)return;
  m.innerHTML=MAPMETA.map((x,i)=>`<a onclick="goto(${i+1})" id="map-${ORDER[i+1]}"><span class="mico">${x[0]}</span><span><div class="mtitle">${x[1]}</div><div class="msub">${x[2]}</div></span><span class="mdone">✓</span></a>`).join('')}
function refresh(){
  let done=0;
  ORDER.forEach(id=>{
    const req=REQS[id];const ok=req.length&&req.every(r=>state.simsDone.has(r));
    if(ok)done++;
    const ls=document.getElementById('ls-'+id);
    if(ls){if(!req.length)ls.textContent='';
      else{const c=req.filter(r=>state.simsDone.has(r)).length;
        ls.textContent=ok?'✓ lesson complete':c+'/'+req.length+' steps done';ls.className='lstat'+(ok?' ok':'')}}
    const ma=document.getElementById('map-'+id);if(ma)ma.classList.toggle('done',ok)});
  const total=ORDER.filter(id=>REQS[id].length).length;
  document.getElementById('pfill').style.width=(done/total*100)+'%';
  document.getElementById('plab').textContent=done+'/'+total;
  const sr=document.getElementById('stRows');
  if(sr){sr.textContent=state.rows;
    document.getElementById('stMins').textContent=(state.mins/60).toFixed(1)+'h';
    document.getElementById('stFiles').textContent=Math.max(0,Object.keys(FILES).length-SEEDCOUNT)}
  if(state.quiz.size===5){const rw=document.getElementById('ratewrap');if(rw)rw.style.display='block'}}
function markDone(btn,key){btn.classList.add('picked');btn.textContent='✓ '+btn.textContent.replace(/^✓ /,'');
  if(!state.simsDone.has(key)){state.simsDone.add(key);refresh()}}
function branch(btn,outId,key){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('picked'));btn.classList.add('picked');
  btn.closest('.step').querySelectorAll('.branchout').forEach(o=>o.classList.remove('show'));
  document.getElementById(outId).classList.add('show');
  if(key&&!state.simsDone.has(key)){state.simsDone.add(key);refresh()}}
function tab(btn,paneId){const t=btn.parentElement;t.querySelectorAll('button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  const panes=t.nextElementSibling;panes.querySelectorAll(':scope>div').forEach(p=>p.classList.remove('active'));
  document.getElementById(paneId).classList.add('active')}
function rateReady(n){
  document.querySelectorAll('#rateBtns button').forEach((b,i)=>{b.classList.toggle('sel',i===n-1)});
  const h=document.getElementById('homework');if(h)h.style.display='block';
  h&&h.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function pickTrouble(key,btn){
  document.querySelectorAll('#troublePicker button').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  const term=document.querySelector('.term[data-sim="trouble"]');
  if(!term)return;
  const inp=term.querySelector('.suggest-in');
  if(inp)inp.value=key;
  // reset the terminal body so each pick runs fresh
  term.querySelector('.term-body').innerHTML='';
  const btnr=term.querySelector('.runbtn');btnr.disabled=false;btnr.textContent='Run it';
  term.querySelectorAll('.done-tag').forEach(t=>t.remove());
}
function wireQuiz(){
  document.querySelectorAll('.quiz').forEach(qz=>{
    qz.querySelectorAll('.qopts button').forEach(b=>b.onclick=()=>{
      if(qz.dataset.answered)return;
      if(b.dataset.r==='1'){b.classList.add('right');qz.dataset.answered='1';
        state.quiz.add(qz.dataset.q);state.simsDone.add('q'+qz.dataset.q);refresh()}
      else b.classList.add('wrong')})})}
renderTree();render();
</script>
