 ['🔍','Answer with evidence','discovery across all evidence · official metric retrieval'],
 ['🔬','Understand a feature','product flow · docs · targeted GitHub read, confidence-tagged'],
 ['📐','Define the product','Feature Contract · PRD refinement · live prototype'],
 ['🧪','Run a research loop','slate · study · transcript · findings · experiment triage'],
 ['🗺','Keep the roadmap coherent','two initiatives · four surfaces · grouped approval'],
 ['🚢','Close delivery into strategy','launch drift · competition · strategy · recovery'],
 ['🛟','When things go wrong','12 failure modes · scheduling · why it earns trust'],
 ['🎓','Finale','what accumulated + a real readiness check']];
const LESSON_POSTERS=['SETUP','CONTEXT','CAPTURE','SOURCES','MEETINGS','EVIDENCE','SYSTEMS','DEFINE','RESEARCH','ROADMAP','STRATEGY','RECOVER','READY'];
const LESSON_SHORT=['Setup','Context','Quick close','Sources','Meetings','Discovery','Code','Define','Research','Roadmap','Strategy','Recover','Finale'];
function applyPreservedVisualShell(section,id,orderIndex){
  if(id==='home')return;
  section.classList.add('preserved-course-view');
  const courseIndex=orderIndex-1;
  const eyebrow=section.querySelector(':scope > .eyebrow');
  const title=section.querySelector(':scope > h1');
  const art=section.querySelector(':scope > .illo-wrap');
  const objective=section.querySelector(':scope > .lesson-orientation');
  const rail=document.createElement('nav');
  rail.className='preserved-rail';rail.setAttribute('aria-label','All course lessons');
  rail.innerHTML=LESSON_SHORT.map((name,i)=>`<button class="${i===courseIndex?'active':''}" onclick="goto(${i+1})">${i===12?'FIN':String(i).padStart(2,'0')}<br>${name}</button>`).join('');
  const hero=document.createElement('header');hero.className='preserved-lab-hero';
  const poster=document.createElement('div');poster.className='preserved-lab-poster';poster.setAttribute('aria-hidden','true');poster.textContent=LESSON_POSTERS[courseIndex]||'WORKBENCH';
  const intro=document.createElement('div');intro.className='preserved-lab-intro';
  const visual=document.createElement('div');visual.className='preserved-lab-visual';
  if(eyebrow)intro.appendChild(eyebrow);if(title)intro.appendChild(title);if(objective)intro.appendChild(objective);
  if(art)visual.appendChild(art);
  const tag=document.createElement('span');tag.className='preserved-lab-tag';tag.textContent='Seeded · inspectable';visual.appendChild(tag);
  hero.append(poster,intro,visual);
  const body=document.createElement('div');body.className='preserved-lesson-body';
  [...section.children].forEach(node=>body.appendChild(node));
  structurePreservedBody(body,title?title.textContent.trim():(LESSON_SHORT[courseIndex]||'Lesson'),id);
  section.append(rail,hero,body);
}
function structurePreservedBody(body,lessonTitle,lessonId){
  const footer=body.querySelector(':scope > .footer-nav');
  const nodes=[...body.children].filter(node=>node!==footer);
  let stage=null,stageIndex=0;
  const startStage=()=>{stage=document.createElement('section');stage.className='preserved-stage';stage.dataset.stage=String(++stageIndex).padStart(2,'0')};
  startStage();
  nodes.forEach(node=>{
    if(node.matches('h2,h3')&&stage.childElementCount){body.appendChild(stage);startStage()}
    stage.appendChild(node)
  });
  if(stage.childElementCount){if(stage.querySelector('.term'))stage.classList.add('has-terminal');body.appendChild(stage)}
  let stages=[...body.querySelectorAll(':scope > .preserved-stage')];
  stages.slice().forEach((lessonStage,index)=>{
    const interactive=lessonStage.querySelector('.term,.quiz,button,input,textarea');
    if(interactive||stages.length===1)return;
    const target=index===0?stages[index+1]:stages[index-1];
    if(!target)return;
    const children=[...lessonStage.children];
    if(index===0)children.reverse().forEach(node=>target.insertBefore(node,target.firstChild));
    else children.forEach(node=>target.appendChild(node));
    lessonStage.remove();stages=stages.filter(item=>item!==lessonStage)
  });
  const work=document.createElement('div');work.className='preserved-lab-work';
  const sequence=document.createElement('aside');sequence.className='preserved-sequence';
  const kicker=document.createElement('span');kicker.className='kicker';kicker.textContent='Guided simulation';
  const buttons=document.createElement('div');buttons.className='preserved-stage-buttons';
  const panels=document.createElement('div');panels.className='preserved-stage-panels';
  stages.forEach((lessonStage,index)=>{
    const heading=lessonStage.querySelector(':scope > h2,:scope > h3');
    const stepTitle=lessonStage.querySelector(':scope > .step .stitle');
    const principleTitle=lessonStage.querySelector(':scope > .lesson-principles b,:scope > p > b');
    const lede=lessonStage.querySelector(':scope > .lede');
    const ledeLabel=lede?lede.textContent.split(/[—.]/)[0].trim():'';
    const rawLabel=(heading&&heading.textContent.trim())||(stages.length===1&&lessonTitle)||(principleTitle&&principleTitle.textContent.trim())||ledeLabel||(stepTitle&&stepTitle.textContent.trim())||lessonTitle;
    const label=(rawLabel.charAt(0).toUpperCase()+rawLabel.slice(1)).replace(/\.$/,'');
    lessonStage.classList.toggle('has-terminal',!!lessonStage.querySelector('.term'));
    lessonStage.classList.toggle('copy-only',!lessonStage.querySelector('.term'));
    lessonStage.classList.toggle('active',index===0);
    lessonStage.id='stage-'+lessonId+'-'+index;
    const button=document.createElement('button');button.className='preserved-stage-button'+(index===0?' active':'');button.type='button';button.dataset.stageTarget=lessonStage.id;
    const number=document.createElement('b');number.textContent=String(index+1);
    const copy=document.createElement('span');copy.textContent=label;
    button.append(number,copy);
    button.onclick=()=>selectPreservedStage(lessonStage);
    buttons.appendChild(button);panels.appendChild(lessonStage)
  });
  sequence.append(kicker,buttons);work.append(sequence,panels);body.appendChild(work);
  if(footer)body.appendChild(footer)
}
function selectPreservedStage(stage){
  if(!stage)return;
  const body=stage.closest('.preserved-lesson-body');
  body?.querySelectorAll('.preserved-stage-button').forEach(button=>button.classList.toggle('active',button.dataset.stageTarget===stage.id));
  body?.querySelectorAll('.preserved-stage').forEach(panel=>panel.classList.toggle('active',panel===stage))
}
function stageRequirementKeys(stage){
  const lessonId=stage?.closest('.view')?.id.replace('v-','');
  const allowed=REQS[lessonId]||[];
  const keys=[...stage.querySelectorAll('.term')].map(term=>term.dataset.sim);
  stage.querySelectorAll('[onclick]').forEach(node=>{
    const matches=[...(node.getAttribute('onclick')||'').matchAll(/'([^']+)'/g)].map(match=>match[1]);
    matches.filter(key=>allowed.includes(key)).forEach(key=>keys.push(key))
  });
  return [...new Set(keys)].filter(Boolean)
}
function maybeAdvanceStage(stage){
  if(!stage)return;
  const keys=stageRequirementKeys(stage);
  if(!keys.length||!keys.every(key=>state.simsDone.has(key)))return;
  const next=stage.nextElementSibling;
  if(next?.classList.contains('preserved-stage'))setTimeout(()=>selectPreservedStage(next),650)
}
function render(){
  const host=document.getElementById('host');host.innerHTML='';
  ORDER.forEach((id,i)=>{const s=document.createElement('section');s.className='view'+(i===cur?' active':'');s.id='v-'+id;
    s.innerHTML=V[id]+navHTML(i);applyPreservedVisualShell(s,id,i);host.appendChild(s)});
  document.querySelectorAll('.term').forEach(wireTerm);
  wireQuiz();renderMap();refresh();window.scrollTo({top:0})}
function navHTML(i){
  return `<div class="footer-nav">
    <button class="navb" onclick="goto(${i-1})" ${i===0?'disabled':''}>← Back</button>
    <span class="lstat" id="ls-${ORDER[i]}"></span>
    ${i===ORDER.length-1?'<button class="navb primary" onclick="goto(0)">↺ Back to start</button>':`<button class="navb primary" onclick="goto(${i+1})">${i===0?'Start Lesson 0 →':'Next →'}</button>`}</div>`}
function goto(i){if(i<0||i>=ORDER.length)return;cur=i;
  document.querySelectorAll('.view').forEach((v,x)=>v.classList.toggle('active',x===i));
  window.scrollTo({top:0});refresh();
  requestAnimationFrame(()=>document.querySelector('.view.active .preserved-rail button.active')?.scrollIntoView({block:'nearest',inline:'center'}))}
function renderMap(){
  const m=document.getElementById('cmap');if(!m)return;
  m.innerHTML=MAPMETA.map((x,i)=>`<a onclick="goto(${i+1})" id="map-${ORDER[i+1]}"><span class="mico"><span class="map-num">${i<12?String(i).padStart(2,'0'):'✓'}</span><span class="map-icon">${x[0]}</span></span><span class="map-copy"><div class="mtitle">${x[1]}</div><div class="msub">${x[2]}</div></span><span class="mdone">✓</span></a>`).join('')}
function refresh(){
  let done=0;
  const topHome=document.getElementById('topHome'),topCourse=document.getElementById('topCourse');
  if(topHome)topHome.classList.toggle('active',cur===0);
  if(topCourse)topCourse.classList.toggle('active',cur!==0);
  ORDER.forEach(id=>{
    const req=REQS[id];const ok=req.length&&req.every(r=>state.simsDone.has(r));
    if(ok)done++;
    const ls=document.getElementById('ls-'+id);
    if(ls){if(!req.length)ls.textContent='';
      else{const c=req.filter(r=>state.simsDone.has(r)).length;
        ls.textContent=ok?'✓ lesson complete':c+'/'+req.length+' steps done';ls.className='lstat'+(ok?' ok':'')}}
    const ma=document.getElementById('map-'+id);if(ma)ma.classList.toggle('done',ok)});
  const total=ORDER.filter(id=>REQS[id].length).length;
  document.getElementById('pfill').style.width=(done/total*100)+'%';
  document.getElementById('plab').textContent=done+'/'+total;
  const sr=document.getElementById('stRows');
  if(sr){sr.textContent=state.rows;
    document.getElementById('stMins').textContent=(state.mins/60).toFixed(1)+'h';
    document.getElementById('stFiles').textContent=Math.max(0,Object.keys(FILES).length-SEEDCOUNT)}
  if(state.quiz.size===5){const rw=document.getElementById('ratewrap');if(rw)rw.style.display='block'}}
function markDone(btn,key){btn.classList.add('picked');btn.textContent='✓ '+btn.textContent.replace(/^✓ /,'');
  if(!state.simsDone.has(key)){state.simsDone.add(key);refresh()}maybeAdvanceStage(btn.closest('.preserved-stage'))}
function branch(btn,outId,key){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('picked'));btn.classList.add('picked');
  btn.closest('.step').querySelectorAll('.branchout').forEach(o=>o.classList.remove('show'));
  document.getElementById(outId).classList.add('show');
  if(key&&!state.simsDone.has(key)){state.simsDone.add(key);refresh()}maybeAdvanceStage(btn.closest('.preserved-stage'))}
function tab(btn,paneId){const t=btn.parentElement;t.querySelectorAll('button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  const panes=t.nextElementSibling;panes.querySelectorAll(':scope>div').forEach(p=>p.classList.remove('active'));
  document.getElementById(paneId).classList.add('active')}
function rateReady(n){
  document.querySelectorAll('#rateBtns button').forEach((b,i)=>{b.classList.toggle('sel',i===n-1)});
  const h=document.getElementById('homework');if(h)h.style.display='block';
  h&&h.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function pickTrouble(key,btn){
  document.querySelectorAll('#troublePicker button').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  const term=document.querySelector('.term[data-sim="trouble"]');
  if(!term)return;
  const inp=term.querySelector('.suggest-in');
  if(inp)inp.value=key;
  // reset the terminal body so each pick runs fresh
  term.querySelector('.term-body').innerHTML='';
  const btnr=term.querySelector('.runbtn');btnr.disabled=false;btnr.textContent='Run it';
  term.querySelectorAll('.done-tag').forEach(t=>t.remove());
}
function wireQuiz(){
  document.querySelectorAll('.quiz').forEach(qz=>{
    qz.querySelectorAll('.qopts button').forEach(b=>b.onclick=()=>{
      if(qz.dataset.answered)return;
      if(b.dataset.r==='1'){b.classList.add('right');qz.dataset.answered='1';
        state.quiz.add(qz.dataset.q);state.simsDone.add('q'+qz.dataset.q);refresh()}
      else b.classList.add('wrong')})})}
renderTree();render();
</script>
