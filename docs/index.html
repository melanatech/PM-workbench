<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PM Workbench — Learn the system by running it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17221c;--ink-soft:#4a5850;--paper:#f4f6f2;--card:#fff;--ledger:#1e6b4e;--ledger-soft:#e3f0e9;
--amber:#b57116;--amber-soft:#f7ecdb;--line:#dde3dc;--term-bg:#101613;--term-line:#243029;--term-txt:#cfe4d6;
--term-green:#7bd8a8;--term-dim:#7d938a;--term-amber:#e2b46b;--red:#b3402e;--red-soft:#f7e3df;--blue:#2b4a8f;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;font-size:15.5px}
h1,h2,h3,h4,.sg{font-family:'Space Grotesk',sans-serif}
code,pre,.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
code{background:#e9ede8;border-radius:4px;padding:1px 5px;font-size:.88em}
button{font-family:inherit}
header{position:sticky;top:0;z-index:50;background:rgba(244,246,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{font-family:'Space Grotesk';font-weight:700;font-size:16px;white-space:nowrap;cursor:pointer}
.brand span{color:var(--ledger)}
.pbar{flex:1;height:6px;background:var(--line);border-radius:3px;min-width:50px;overflow:hidden}
.pbar>div{height:100%;width:0%;background:var(--ledger);transition:width .5s}
.plab{font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
.os-toggle{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.os-toggle button{border:0;background:none;padding:5px 12px;font:600 12.5px 'IBM Plex Sans';cursor:pointer;color:var(--ink)}
.os-toggle button.active{background:var(--ink);color:#fff}
.wsbtn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:600 13px 'IBM Plex Sans';cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.wsbtn:hover{background:var(--ledger)}
.wsbtn .badge{background:var(--ledger);border-radius:10px;padding:0 8px;font-size:11px;transition:transform .3s}
.wsbtn .badge.pop{transform:scale(1.4)}
[data-os]{display:none}
body.mac [data-os="mac"]{display:revert}
body.win [data-os="win"]{display:revert}
main{max-width:840px;margin:0 auto;padding:28px 18px 60px}
.view{display:none}.view.active{display:block;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font:600 11.5px 'IBM Plex Mono';letter-spacing:.13em;text-transform:uppercase;color:var(--ledger);margin-bottom:8px}
.view h1{font-size:clamp(25px,4.3vw,36px);line-height:1.14;letter-spacing:-.02em;margin-bottom:12px}
.view h2{font-size:21px;margin:30px 0 8px;letter-spacing:-.01em}
.view h3{font-size:16.5px;margin:22px 0 6px}
.view p{margin:10px 0;max-width:690px}
.lede{font-size:16.5px;color:var(--ink-soft)}
.goal{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:14px;max-width:690px}
.goal .gi{font-size:18px}
.why{background:var(--ledger-soft);border-left:3px solid var(--ledger);border-radius:0 8px 8px 0;padding:12px 16px;margin:16px 0;font-size:14px;max-width:690px}
.warn{background:var(--amber-soft);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:12px 16px;margin:16px 0;font-size:14px;max-width:690px}
.note{font-size:13.5px;color:var(--ink-soft);max-width:690px;margin:8px 0}
pre.snip{background:var(--ink);color:#e9efe9;border-radius:8px;padding:12px 15px;font-size:12.5px;overflow-x:auto;margin:10px 0;line-height:1.6}
.footer-nav{display:flex;justify-content:space-between;align-items:center;margin-top:44px;padding-top:18px;border-top:1px solid var(--line);gap:10px}
.navb{border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:8px;padding:10px 20px;font:600 14px 'IBM Plex Sans';cursor:pointer}
.navb.primary{background:var(--ink);color:#fff}
.navb.primary:hover{background:var(--ledger);border-color:var(--ledger)}
.navb:disabled{opacity:.35;cursor:default}
.lstat{font-size:12.5px;color:var(--ink-soft)}
.lstat.ok{color:var(--ledger);font-weight:600}
.map{display:flex;flex-direction:column;gap:8px;margin:22px 0}
.map a{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;text-decoration:none;color:var(--ink);cursor:pointer}
.map a:hover{border-color:var(--ledger)}
.map .mico{font-size:19px;width:26px;text-align:center}
.map .mtitle{font-weight:600;font-size:14px}
.map .msub{font-size:12px;color:var(--ink-soft)}
.map .mdone{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:#fff;flex-shrink:0}
.map a.done .mdone{background:var(--ledger);border-color:var(--ledger)}
.scen{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:14px;margin:18px 0}
.sysdiag{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:20px 0;overflow-x:auto}
.sysdiag svg{display:block;min-width:560px;width:100%}
.tabs{display:flex;border-bottom:2px solid var(--line);margin:14px 0 0}
.tabs button{border:0;background:none;padding:9px 16px;font:600 13.5px 'IBM Plex Sans';cursor:pointer;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs button.active{color:var(--ink);border-bottom-color:var(--ledger)}
.tabpanes>div{display:none;padding:14px 0}
.tabpanes>div.active{display:block}
.step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin:12px 0;max-width:690px}
.step .shead{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.step .snum{font:700 12px 'IBM Plex Mono';color:var(--ledger)}
.step .stitle{font-weight:600;font-size:14.5px}
.step p{font-size:14px;margin:6px 0}
.branch{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.branch button{border:1.5px solid var(--ink);background:#fff;border-radius:8px;padding:8px 14px;font:600 13px 'IBM Plex Sans';cursor:pointer}
.branch button:hover{border-color:var(--ledger);color:var(--ledger)}
.branch button.picked{background:var(--ledger);border-color:var(--ledger);color:#fff}
.branchout{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:14px}
.branchout.show{display:block;animation:fadein .3s}
/* terminal */
.term{background:var(--term-bg);border-radius:var(--radius);margin:16px 0;overflow:hidden;border:1px solid var(--term-line);box-shadow:0 8px 30px rgba(16,22,19,.16)}
.term-head{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--term-line)}
.tdots{display:flex;gap:5px}.tdots i{width:9px;height:9px;border-radius:50%;background:#2c3a32}
.term-title{font:500 11.5px 'IBM Plex Mono';color:var(--term-dim);margin-left:4px}
.term-model{margin-left:auto;font:500 10.5px 'IBM Plex Mono';color:var(--term-dim);border:1px solid var(--term-line);border-radius:20px;padding:2px 9px}
.term-model.opus{color:var(--term-amber);border-color:#4a3d22}
.term-model.haiku{color:#8fc7e8;border-color:#22394a}
.term-body{padding:14px;font-family:'IBM Plex Mono';font-size:12.5px;line-height:1.65;color:var(--term-txt);min-height:44px;max-height:500px;overflow-y:auto}
.tl{white-space:pre-wrap;word-break:break-word}
.tl.user{color:#fff;font-weight:500}.tl.user::before{content:'❯ ';color:var(--term-green)}
.tl.dim{color:var(--term-dim)}.tl.log{color:var(--term-green)}.tl.flag{color:var(--term-amber)}.tl.spacer{height:8px}
.tl.del{color:#e08b7c}.tl.del::before{content:'- '}
.tl.ins{color:var(--term-green)}.tl.ins::before{content:'+ '}
.cursor{display:inline-block;width:7px;height:14px;background:var(--term-green);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.filecard{display:flex;gap:10px;align-items:center;background:#161e19;border:1px solid #2e4536;border-radius:8px;padding:9px 12px;margin:7px 0;cursor:pointer;color:var(--term-txt);font-size:12.5px}
.filecard:hover{border-color:var(--term-green)}
.filecard .fico{color:var(--term-green)}
.filecard .fview{margin-left:auto;font:600 10.5px 'IBM Plex Mono';color:var(--term-green);letter-spacing:.06em;white-space:nowrap}
.filecard.proto{border-color:#3d5a8f}.filecard.proto .fico,.filecard.proto .fview{color:#8fb4e8}
.term-foot{border-top:1px solid var(--term-line);padding:11px 13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.suggest{flex:1;min-width:180px;font-family:'IBM Plex Mono';font-size:12px;color:var(--term-dim);background:#161e19;border:1px dashed var(--term-line);border-radius:6px;padding:8px 11px;overflow-x:auto}
.suggest b{color:var(--term-txt);font-weight:500}
textarea.suggest-in,input.suggest-in{flex:1;min-width:180px;font-family:'IBM Plex Mono';font-size:12px;color:var(--term-txt);background:#161e19;border:1px dashed var(--term-green);border-radius:6px;padding:8px 11px;resize:vertical}
textarea.suggest-in{min-height:58px}
.suggest-in:focus{outline:1px solid var(--term-green)}
.runbtn{background:var(--term-green);color:var(--term-bg);border:0;border-radius:6px;padding:9px 17px;font:600 13px 'IBM Plex Sans';cursor:pointer}
.runbtn:disabled{opacity:.35;cursor:default}
.choices{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 2px}
.choices button{background:none;border:1px solid var(--term-green);color:var(--term-green);border-radius:6px;padding:7px 13px;font:500 12px 'IBM Plex Mono';cursor:pointer}
.choices button.alt{border-color:var(--term-dim);color:var(--term-dim)}
.rate{display:flex;flex-direction:column;gap:8px;max-width:520px}
.rate button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:10px 14px;font:500 13.5px 'IBM Plex Sans';cursor:pointer}
.rate button:hover{border-color:var(--ledger)}
.rate button.sel{background:var(--ledger-soft);border-color:var(--ledger);color:var(--ledger);font-weight:600}
.qanote{background:var(--card);border:1px solid var(--ledger);border-left:3px solid var(--ledger);border-radius:0 8px 8px 0;padding:13px 16px;margin:14px 0;font-size:13.5px;max-width:690px}
.hinge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0}
.hbox{border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600}
.hbox.src{background:#fff;border:1px solid var(--line)}
.hbox.contract{background:var(--ink);color:#fff}
.hbox.pp{background:#fff;border:1px solid var(--line)}
.hbox .hsub{font-weight:400;font-size:11px;color:var(--ink-soft);margin-top:2px}
.hbox.contract .hsub{color:#9db8ab}
.harrow,.hforks{color:var(--ledger);font-weight:700}
.hforks{display:flex;flex-direction:column;font-size:13px;line-height:1}
.picker{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.picker button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font:500 12.5px 'IBM Plex Sans';cursor:pointer}
.picker button:hover{border-color:var(--ledger)}
.picker button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.done-tag{font:600 10.5px 'IBM Plex Mono';color:var(--term-green);letter-spacing:.08em}
/* dashboard */
.dash{background:linear-gradient(180deg,#1b2a5e,#14204a);border-radius:10px;padding:18px 20px;color:#fff;max-width:480px;margin:14px 0}
.dash .dtitle{font-size:12px;color:#9fb0e0;letter-spacing:.05em;text-transform:uppercase}
.dash .dval{font:700 40px 'Space Grotesk';margin:2px 0}
.dash .dmeta{font-size:12px;color:#9fb0e0}
/* roadmap board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;max-width:690px}
.bcol{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:130px}
.bcol h5{font:600 11px 'IBM Plex Mono';letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;padding:0 3px}
.bcard{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:7px;padding:8px 10px;margin-bottom:7px;font-size:12.5px;transition:all .4s}
.bcard .bmeta{font:500 10.5px 'IBM Plex Mono';color:var(--ink-soft);margin-top:2px}
.bcard.f2{border-left-color:var(--amber)}
.bcard.moved{border-color:var(--ledger);background:var(--ledger-soft);animation:fadein .5s}
/* workspace drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--card);z-index:80;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:-12px 0 40px rgba(23,34,28,.18);display:flex;flex-direction:column}
.drawer.open{transform:none}
.dr-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dr-head h3{font-size:15px}
.dr-head .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink-soft)}
.dr-body{flex:1;overflow-y:auto;padding:14px 18px}
.ftree .fgroup{font:600 11px 'IBM Plex Mono';letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 6px}
.ftree .fitem{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px;font:400 12.5px 'IBM Plex Mono';cursor:pointer;background:#fff}
.ftree .fitem:hover{border-color:var(--ledger)}
.ftree .fitem .upd{margin-left:auto;font:600 10px 'IBM Plex Mono';color:var(--ledger)}
.ftree .fitem.flash{background:var(--ledger-soft);border-color:var(--ledger)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(23,34,28,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mwin{background:var(--card);border-radius:12px;width:min(740px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mhead{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.mhead .mpath{font:500 12.5px 'IBM Plex Mono';color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhead .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink-soft)}
.mbody{overflow-y:auto;padding:18px 20px;font-family:'IBM Plex Mono';font-size:12.5px;line-height:1.7;white-space:pre-wrap}
.mbody.render{font-family:'IBM Plex Sans';white-space:normal;padding:0}
/* prototype mock */
.proto-app{background:#f7f8fa;min-height:380px;padding:18px}
.pa-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pa-logo{font:700 15px 'Space Grotesk';color:var(--blue)}
.pa-nav{font-size:12px;color:#7a8699}
.pa-title{font:700 19px 'Space Grotesk';margin:4px 0 12px}
.pa-states{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pa-states button{border:1px solid #cdd4de;background:#fff;border-radius:16px;padding:5px 12px;font:500 12px 'IBM Plex Sans';cursor:pointer}
.pa-states button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pa-panel{background:#fff;border:1px solid #e2e6ec;border-radius:10px;padding:14px;box-shadow:0 2px 8px rgba(20,32,74,.05)}
.pa-row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid #eef1f5;font-size:13px}
.pa-row:last-child{border-bottom:0}
.pa-av{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:600 12px 'IBM Plex Sans'}
.pa-name{font-weight:600;min-width:120px}
.pa-bar{flex:1;height:8px;background:#eef1f5;border-radius:4px;overflow:hidden}
.pa-bar>div{height:100%;background:var(--blue)}
.pa-val{font:600 12px 'IBM Plex Mono';min-width:40px;text-align:right}
.pa-exp{border:1px solid #cdd4de;background:#fff;border-radius:6px;padding:4px 10px;font-size:11.5px;cursor:pointer}
.pa-empty{text-align:center;padding:36px 16px;color:#7a8699}
.pa-empty .pe-ic{font-size:34px}
.pa-denied{text-align:center;padding:36px 16px;color:#a3452f;background:#fdf3f0;border-radius:8px}
.pa-instr{margin-top:10px;font:500 10.5px 'IBM Plex Mono';color:#7a8699}
.pa-instr span{background:#eef1f5;border-radius:4px;padding:1px 6px;margin-right:5px;display:inline-block;margin-top:3px}
/* quiz + finale */
.quiz{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0;max-width:690px}
.quiz .q{font-weight:600;margin-bottom:9px;font-size:14.5px}
.qopts{display:flex;flex-direction:column;gap:7px}
.qopts button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 13px;font:400 13.5px 'IBM Plex Sans';cursor:pointer}
.qopts button.right{border-color:var(--ledger);background:var(--ledger-soft)}
.qopts button.wrong{border-color:var(--red);background:var(--red-soft)}
.finale-stats{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}
.fstat{background:var(--ink);color:#fff;border-radius:12px;padding:18px 22px;flex:1;min-width:170px;text-align:center}
.fstat .fv{font:700 36px 'Space Grotesk';color:var(--term-green)}
.fstat .fl{font:500 10.5px 'IBM Plex Mono';letter-spacing:.08em;text-transform:uppercase;color:#8aa596;margin-top:4px}
@media(max-width:640px){.board{grid-template-columns:1fr}}

/* ===== Illustration system: A=hand-drawn (human/capture), B=flat vector (people/stakeholder), C=geometric/abstract (structural/systemic) ===== */
.illo-wrap{display:flex;justify-content:center;margin:8px 0 4px}
.illo{width:96px;height:96px}
/* A: hand-drawn marker doodle - stroke draw-in, sized per-path so it's proportional not instant */
.illo-a path,.illo-a circle{stroke-dasharray:220;stroke-dashoffset:220;animation:illoDraw 1s ease forwards}
.illo-a .d1{stroke-dasharray:140;stroke-dashoffset:140;animation-duration:.7s}
.illo-a .d2{animation-delay:.5s;stroke-dasharray:90;stroke-dashoffset:90;animation-duration:.5s}
.illo-a .d3{animation-delay:.8s;stroke-dasharray:70;stroke-dashoffset:70;animation-duration:.45s}
.illo-a .d4{animation-delay:1.05s;stroke-dasharray:60;stroke-dashoffset:60;animation-duration:.4s}
@keyframes illoDraw{to{stroke-dashoffset:0}}
/* B: flat vector character - gentle bob */
.illo-b{animation:illoBob 2.6s ease-in-out infinite}
@keyframes illoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* C: geometric/abstract - blob drifts, ring spins slowly */
.illo-c .illo-blob{animation:illoBlob 6s ease-in-out infinite}
@keyframes illoBlob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(2px,-3px) scale(1.02)}}
.illo-c .illo-ring{transform-origin:48px 48px;animation:illoSpin 12s linear infinite}
@keyframes illoSpin{to{transform:rotate(360deg)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* =====================================================================
   WORK IN MOTION — COURSE VISUAL SYSTEM
   The original course behavior and content are preserved. This layer
   replaces the generic LMS surface with the production design direction.
   ===================================================================== */
:root{
  --ink:#111111;--ink-soft:#68655f;--paper:#f4f0e6;--card:#fffefa;
  --ledger:#2854ff;--ledger-soft:#e7ebff;--amber:#ff4f62;--amber-soft:#ffe8e8;
  --line:#c9c4b8;--term-bg:#111111;--term-line:#34332f;--term-txt:#f4f0e6;
  --term-green:#c5ec27;--term-dim:#a8a49a;--term-amber:#ff4f62;
  --red:#ff4f62;--red-soft:#ffe8e8;--blue:#2854ff;--teal:#16bfb2;
  --lime:#c5ec27;--radius:0;--display:'League Gothic','Arial Narrow',sans-serif
}
*{border-radius:0!important}
html{scroll-behavior:smooth}
body{
  position:relative;overflow-x:hidden;color:var(--ink);background-color:var(--paper);
  background-image:
    radial-gradient(circle at 16% 22%,rgba(17,17,17,.10) 0 .55px,transparent .75px),
    radial-gradient(circle at 71% 63%,rgba(17,17,17,.07) 0 .45px,transparent .7px),
    repeating-linear-gradient(2deg,rgba(92,70,35,.018) 0 1px,transparent 1px 7px);
  background-size:8px 8px,11px 11px,100% 9px;
  font-size:16px;line-height:1.62
}
body::before{
  content:"";position:fixed;inset:0;z-index:1000;pointer-events:none;opacity:.12;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.26'/%3E%3C/svg%3E")
}
::selection{background:var(--lime);color:var(--ink)}
button:focus-visible,[role=button]:focus-visible,a:focus-visible{outline:3px solid var(--coral)!important;outline-offset:3px}
code{color:var(--blue);background:rgba(197,236,39,.48);padding:2px 5px;font-weight:600}

header{

}
header::before,header::after{content:"";position:absolute;top:50%;width:28px;height:28px;opacity:.42;transform:translateY(-50%);

header::before{left:8px}header::after{right:8px}
.hwrap{max-width:1240px;padding:10px 42px;gap:16px}
.brand{font:400 25px/1 var(--display);letter-spacing:.01em;text-transform:uppercase}
.brand span{color:var(--blue)}
.pbar{height:4px;background:rgba(17,17,17,.14)}
.pbar>div{background:var(--blue)}
.plab{font:700 11px/1 var(--mono);color:var(--ink);text-transform:uppercase}
.os-toggle{border:1px solid var(--ink)}
.os-toggle button{padding:7px 12px;font:700 10px/1 var(--mono);text-transform:uppercase}
.os-toggle button.active{background:var(--ink)}
.wsbtn{position:relative;border:1px solid var(--ink);background:var(--ink);padding:8px 14px;font:700 11px/1 var(--mono);letter-spacing:.02em;text-transform:uppercase}
.wsbtn:hover{background:var(--blue)}
.wsbtn .badge{background:var(--lime);color:var(--ink);padding:2px 7px}

main{position:relative;max-width:1140px;padding:48px 38px 100px}
.view{position:relative;min-height:720px;isolation:isolate}
.view::before{
  position:absolute;z-index:-3;left:-7vw;top:-34px;color:var(--ink);opacity:.055;
  font:400 clamp(150px,20vw,290px)/.76 var(--display);letter-spacing:-.025em;text-transform:uppercase;white-space:nowrap
}
.view::after{
  content:"";position:absolute;z-index:-2;left:-30vw;right:-30vw;top:185px;height:5px;background:var(--blue);opacity:.9;
  transform:rotate(-1.2deg);transform-origin:center
}
#v-home::before{content:"WORKBENCH"}#v-l0::before{content:"START"}#v-l1::before{content:"CONTEXT"}
#v-l2::before{content:"CAPTURE"}#v-l3::before{content:"SOURCES"}#v-l4::before{content:"COORDINATE"}
#v-l5::before{content:"EVIDENCE"}#v-l6::before{content:"SYSTEMS"}#v-l7::before{content:"DEFINE"}
#v-l8::before{content:"RESEARCH"}#v-l9::before{content:"ROADMAP"}#v-l10::before{content:"STRATEGY"}
#v-l11::before{content:"RECOVER"}#v-fin::before{content:"ACCUMULATE"}
.view.active{animation:scene-enter .48s cubic-bezier(.2,.8,.2,1)}
@keyframes scene-enter{from{opacity:0;transform:translateY(14px)}}
.eyebrow{
  position:relative;z-index:3;display:inline-block;margin:0 0 17px;padding:5px 8px;color:var(--ink);background:var(--lime);
  box-shadow:10px 0 0 rgba(197,236,39,.42);font:700 11px/1.2 var(--mono);letter-spacing:.06em
}
.view h1{
  position:relative;z-index:3;max-width:780px;margin:0 0 22px;color:var(--blue);

}
.view h1::after{
  content:"";position:absolute;left:0;bottom:-10px;width:min(420px,65%);height:13px;
  border-top:3px solid var(--coral);border-radius:50%;transform:rotate(-1deg)
}
.view h2{position:relative;margin:46px 0 13px;font:400 36px/.95 var(--display);letter-spacing:.005em;text-transform:uppercase}
.view h2::after{content:"";display:block;width:120px;height:9px;margin-top:7px;border-top:3px solid var(--blue);border-radius:50%;transform:rotate(-1deg)}
.view h3{margin:31px 0 8px;font:700 18px/1.1 var(--mono);letter-spacing:-.02em;text-transform:uppercase}
.view p{max-width:760px}
.lede{max-width:720px;color:#383631;font-size:18px;line-height:1.55}

.illo-wrap{
  position:absolute;z-index:7;right:20px;top:-22px;width:255px;height:205px;margin:0;display:grid;place-items:center;
  background:rgba(244,240,230,.94);clip-path:polygon(8% 7%,84% 0,100% 20%,94% 81%,74% 100%,17% 91%,0 67%,4% 26%);
  filter:drop-shadow(8px 11px 0 rgba(17,17,17,.07))
}
.illo-wrap::before{content:"";position:absolute;inset:10px;border:2px dashed var(--blue);clip-path:inherit}
.illo{position:relative;width:150px;height:150px;filter:saturate(1.5) contrast(1.05)}
.illo [fill="#1e6b4e"]{fill:var(--blue)!important}.illo [fill="#17221c"]{fill:var(--ink)!important}
.illo [fill="#b57116"]{fill:var(--coral)!important}.illo [fill="#e3f0e9"]{fill:var(--lime)!important}
.illo [stroke="#1e6b4e"]{stroke:var(--blue)!important}.illo [stroke="#17221c"]{stroke:var(--ink)!important}
.illo [stroke="#b57116"]{stroke:var(--coral)!important}.illo [stroke="#dde3dc"]{stroke:rgba(40,84,255,.24)!important}

.goal,.why,.warn,.scen,.step,.sysdiag,.quiz,.qanote,.hinge,.dash,.fstat{
  position:relative;border:0;background-color:var(--card);
  background-image:radial-gradient(circle at 18% 28%,rgba(17,17,17,.08) 0 .5px,transparent .8px);

.goal{max-width:760px;margin:25px 0;padding:18px 23px 19px 44px;clip-path:polygon(2% 1%,99% 4%,97% 94%,91% 100%,2% 97%,0 12%)}

.goal .gi{color:var(--blue)}

.warn{max-width:720px;margin:25px 0 25px 18px;padding:20px 23px;background-color:#ffe9e8;clip-path:polygon(2% 0,98% 4%,100% 91%,87% 100%,0 96%);transform:rotate(-.7deg)}
.warn::before{content:"WATCH";display:block;margin-bottom:7px;color:var(--coral);font:700 10px/1 var(--mono);letter-spacing:.1em}
.note{max-width:740px;color:var(--ink-soft);font:500 13px/1.55 var(--mono)}
.scen{max-width:760px;margin:28px 0;padding:25px 31px 25px 68px;clip-path:polygon(1% 3%,98% 0,100% 90%,94% 98%,2% 95%,0 14%);transform:rotate(.35deg)}
.scen::before{content:"“";position:absolute;left:20px;top:12px;color:var(--blue);font:700 64px/.8 Georgia,serif}
.step{max-width:780px;margin:20px 0;padding:21px 24px;clip-path:polygon(1% 2%,98% 0,100% 89%,95% 100%,3% 96%,0 10%)}
.step:nth-of-type(2n){margin-left:15px;clip-path:polygon(3% 0,100% 4%,98% 96%,83% 100%,0 94%,1% 8%);transform:rotate(.3deg)}
.step .snum{display:inline-block;padding:3px 6px;color:var(--ink);background:var(--lime)}
.step .stitle{font:700 15px/1.3 var(--mono);text-transform:uppercase}

.sysdiag{max-width:900px;margin:34px 0;padding:28px;clip-path:polygon(2% 1%,98% 0,100% 95%,94% 100%,1% 97%,0 8%)}
.sysdiag::before,.sysdiag::after{content:"";position:absolute;width:30px;height:30px;opacity:.42;background:linear-gradient(var(--ink),var(--ink)) center/1px 100% no-repeat,linear-gradient(90deg,var(--ink),var(--ink)) center/100% 1px no-repeat}
.sysdiag::before{left:7px;top:7px}.sysdiag::after{right:7px;bottom:7px}
.sysdiag svg text{font-family:var(--mono)!important}.sysdiag svg [fill="#1e6b4e"]{fill:var(--blue)!important}
.sysdiag svg [stroke="#1e6b4e"]{stroke:var(--blue)!important}

.term{
  position:relative;max-width:940px;margin:30px 0;border:0;background:var(--term-bg);
  clip-path:polygon(1% 0,99% 1%,100% 96%,96% 100%,2% 98%,0 5%);
  box-shadow:none;filter:drop-shadow(12px 14px 0 rgba(17,17,17,.13))
}
.term::after{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.12;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence baseFrequency='.8' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E")
}
.term>*{position:relative;z-index:1}
.term-head{padding:13px 18px;border-color:#3b3934}
.tdots i{width:8px;height:8px;background:var(--coral)}.tdots i:nth-child(2){background:var(--lime)}.tdots i:nth-child(3){background:var(--blue)}
.term-title{font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.term-model{border:0;color:var(--lime);background:#272722;padding:4px 9px}
.term-body{padding:20px 22px;font-size:13px}.tl.user::before{content:'→ ';color:var(--lime)}
.term-foot{padding:14px 19px;border-color:#3b3934}.suggest,.suggest-in{border-color:#545149!important;background:#1a1a18!important}
.runbtn{border:1px solid var(--lime);background:var(--lime);font:700 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.choices button{border-color:var(--lime);font-size:11px;text-transform:uppercase}
.filecard{border:0;background:#f7f3e8;color:var(--ink);clip-path:polygon(2% 2%,99% 0,100% 91%,94% 100%,1% 96%);transform:rotate(-.25deg)}
.filecard:nth-child(even){transform:rotate(.4deg);background:#eef0ff}.filecard .fico,.filecard .fview,.filecard.proto .fico,.filecard.proto .fview{color:var(--blue)}

.map{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 30px;margin:45px 0 25px;padding:15px 10px 20px 45px}
.map::before{content:"";position:absolute;z-index:-1;left:24px;top:0;bottom:0;width:5px;background:var(--blue);transform:rotate(-.8deg)}
.map a{
  position:relative;min-height:108px;padding:21px 26px;border:0;background-color:var(--card);
  background-image:radial-gradient(circle,rgba(17,17,17,.08) 0 .6px,transparent .8px);background-size:8px 8px;
  clip-path:polygon(2% 1%,98% 4%,100% 91%,94% 100%,1% 96%,0 10%);filter:drop-shadow(7px 9px 0 rgba(17,17,17,.08));
  transform:rotate(-.5deg)
}
.map a:nth-child(2n){clip-path:polygon(3% 0,100% 2%,97% 96%,83% 100%,0 93%);transform:rotate(.55deg)}
.map a::before{content:"";position:absolute;left:-34px;top:50%;width:34px;border-top:5px solid var(--blue)}
.map a::after{content:"";position:absolute;left:-42px;top:calc(50% - 6px);width:13px;height:13px;background:var(--blue);border:3px solid var(--paper);border-radius:50%!important}
.map a:hover{transform:rotate(0) translateY(-3px);filter:drop-shadow(10px 13px 0 rgba(17,17,17,.09))}
.map .mico{display:grid;place-items:center;width:42px;height:42px;color:#fff;background:var(--ink);font-size:19px}
.map .mtitle{font:700 14px/1.2 var(--mono);text-transform:uppercase}
.map .msub{margin-top:6px;color:var(--soft);font:500 11px/1.35 var(--mono)}
.map .mdone{border:2px solid var(--blue);border-radius:50%!important}
.map a.done .mdone{background:var(--teal);border-color:var(--teal)}

.tabs{max-width:850px;margin-top:26px;border-bottom:1px solid var(--ink)}
.tabs button{padding:11px 15px;border-bottom:5px solid transparent;font:700 11px/1 var(--mono);letter-spacing:.03em;text-transform:uppercase}
.tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}
.branch button,.picker button,.rate button,.qopts button,.navb{
  border:1px solid var(--ink);background:rgba(255,254,250,.75);padding:10px 14px;
  font:700 11px/1.25 var(--mono);text-transform:uppercase
}
.branch button:hover,.picker button:hover,.rate button:hover,.qopts button:hover{border-color:var(--blue);color:var(--blue)}
.branch button.picked,.picker button.sel,.rate button.sel{border-color:var(--blue);background:var(--blue);color:#fff}

.hinge{max-width:940px;margin:34px 0;padding:33px 27px;display:flex;gap:12px;background-color:rgba(244,240,230,.72);border:2px dashed var(--blue);clip-path:polygon(1% 3%,98% 0,100% 93%,94% 100%,2% 97%,0 10%);filter:none}
.hbox{position:relative;padding:15px 16px;background:var(--card)!important;color:var(--ink)!important;border:0!important;clip-path:polygon(3% 0,100% 5%,97% 100%,0 94%);filter:drop-shadow(4px 6px 0 rgba(17,17,17,.08))}
.hbox.contract{background:var(--ink)!important;color:#fff!important}.hbox.contract .hsub{color:var(--lime)}
.harrow,.hforks{color:var(--blue)}

.dash{max-width:570px;margin:25px 0;padding:23px 27px;color:#fff;background:var(--blue);clip-path:polygon(2% 0,99% 3%,100% 90%,93% 100%,0 96%);filter:drop-shadow(8px 10px 0 rgba(17,17,17,.09))}
.dash .dtitle,.dash .dmeta{color:#e4e8ff}.dash .dval{font:400 64px/.9 var(--display)}
.board{position:relative;max-width:920px;gap:18px;margin:28px 0;padding:26px 20px 32px;background:rgba(244,240,230,.72);border:2px dashed var(--blue)}
.board::before{content:"ROADMAP / LIVE STATE";position:absolute;left:20px;top:-11px;padding:4px 8px;background:var(--lime);font:700 9px/1 var(--mono)}
.bcol{border:0;background:transparent;padding:12px}.bcol h5{color:var(--ink);font-size:12px}
.bcard{border:0;border-left:7px solid var(--blue);background:var(--card);padding:13px 15px;clip-path:polygon(2% 0,100% 4%,97% 100%,0 95%);filter:drop-shadow(4px 6px 0 rgba(17,17,17,.07))}
.bcard.f2{border-left-color:var(--coral)}.bcard.moved{border-left-color:var(--teal);background:#e8fff8}

.quiz{max-width:820px;margin:25px 0;padding:23px 27px;clip-path:polygon(1% 1%,98% 0,100% 91%,94% 100%,2% 96%,0 9%)}
.quiz:nth-of-type(even){margin-left:18px;transform:rotate(.25deg);background-color:#eef0ff}
.quiz .q{font:700 15px/1.4 var(--mono);text-transform:none}
.qopts button{text-transform:none;background:rgba(255,254,250,.85)}
.qopts button.right{border-color:var(--teal);background:#e4fff8}.qopts button.wrong{border-color:var(--coral);background:#ffe8e8}
.finale-stats{gap:18px;margin:35px 0}.fstat{min-width:220px;padding:27px 23px;background:var(--ink);clip-path:polygon(2% 0,100% 5%,97% 95%,88% 100%,0 93%)}
.fstat:nth-child(2){background:var(--blue);transform:rotate(-.7deg)}.fstat:nth-child(3){background:#123e37;transform:rotate(.6deg)}
.fstat .fv{color:var(--lime);font:400 62px/.85 var(--display)}.fstat .fl{color:#d7d4ca}

.footer-nav{max-width:940px;margin-top:64px;padding-top:24px;border-top:5px solid var(--ink)}
.navb{min-width:130px}.navb.primary{border-color:var(--blue);background:var(--blue)}
.lstat{font:700 10px/1 var(--mono);text-transform:uppercase}.lstat.ok{color:var(--teal)}

.drawer{background-color:var(--paper);background-image:radial-gradient(circle,rgba(17,17,17,.08) 0 .5px,transparent .7px);background-size:8px 8px;box-shadow:-16px 0 0 var(--ink)}
.dr-head{padding:21px 24px;border-bottom:5px solid var(--ink)}.dr-head h3{font:400 27px/1 var(--display);text-transform:uppercase}
.dr-body{padding:21px 24px}.ftree .fgroup{display:inline-block;padding:4px 7px;background:var(--lime);color:var(--ink)}
.ftree .fitem{border:0;background:var(--card);padding:12px 14px;clip-path:polygon(1% 2%,99% 0,100% 90%,94% 100%,0 95%);filter:drop-shadow(4px 5px 0 rgba(17,17,17,.06))}
.ftree .fitem:nth-child(even){transform:rotate(.25deg)}.ftree .fitem:hover{color:var(--blue)}
.ftree .fitem .upd{color:var(--teal)}

.modal{background:rgba(17,17,17,.72)}.mwin{background:var(--paper);clip-path:polygon(1% 0,99% 1%,100% 96%,96% 100%,1% 98%,0 5%);box-shadow:18px 22px 0 rgba(17,17,17,.27)}
.mhead{padding:16px 22px;border-bottom:5px solid var(--ink)}.mbody{padding:25px 28px}
.proto-app{background:var(--paper)}.pa-logo{color:var(--blue)}.pa-states button.on{background:var(--blue);border-color:var(--blue)}
.pa-panel{border:0;background:var(--card);clip-path:polygon(1% 1%,99% 0,100% 95%,94% 100%,0 97%);filter:drop-shadow(6px 8px 0 rgba(17,17,17,.07))}
.pa-av,.pa-bar>div{background:var(--blue)}

@media(max-width:900px){
  main{padding:38px 24px 90px}.view h1{max-width:70%;font-size:clamp(48px,10vw,76px)}
  .illo-wrap{right:0;width:210px;height:180px;opacity:.95}.illo{width:125px;height:125px}
  .map{grid-template-columns:1fr}.map a{min-height:90px}
  .hinge{align-items:stretch}.hbox{flex:1}.hforks{display:none}
}
@media(max-width:640px){
  .hwrap{padding:8px 18px;gap:8px;flex-wrap:wrap}.brand{font-size:20px}.pbar{order:4;flex-basis:100%}
  .os-toggle button{padding:6px 8px}.wsbtn{padding:7px 9px}
  main{padding:28px 16px 80px}.view{padding-left:22px}
  .view::before{left:-34px;top:20px;font-size:130px;writing-mode:vertical-rl;transform:rotate(180deg)}
  .view::after{left:3px;right:auto;top:175px;bottom:45px;width:5px;height:auto;transform:none}
  .view h1{max-width:100%;font-size:49px}.view h2{font-size:30px}
  .illo-wrap{position:relative;right:auto;top:auto;width:100%;height:185px;margin:20px 0 8px}.illo{width:130px;height:130px}
  .goal,.why,.warn,.scen,.step,.sysdiag,.term,.quiz,.hinge,.dash{margin-left:12px}
  .map{padding-left:30px}.map::before{left:10px}.map a::before{left:-24px;width:24px}.map a::after{left:-31px}
  .hinge{flex-direction:column}.harrow{transform:rotate(90deg);align-self:center}
  .board{grid-template-columns:1fr}.footer-nav{gap:8px}.navb{min-width:0;padding:9px 10px}.lstat{font-size:9px;text-align:center}
}

.home-system-section{padding:100px max(5vw,38px);border-bottom:2px solid var(--ink);background:rgba(255,254,250,.58)}

:root{--paper2:#ebe4d5;--blue2:#dfe6ff;--coral:#ff5a67;--soft:#67635c;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}

.pbar{display:none}.plab{font:700 14px var(--mono);color:var(--ink)}
.os-toggle{border:1px solid var(--ink);border-radius:0;background:var(--card);padding:2px;box-shadow:3px 3px 0 var(--blue)}
.os-toggle button{border:0;padding:6px 8px;color:var(--soft);font:700 9px var(--mono);text-transform:uppercase}
.os-toggle button.active{background:var(--ink);color:var(--lime)}
.wsbtn{border:1px solid var(--ink);border-radius:0;padding:9px 13px;box-shadow:4px 4px 0 var(--blue)}

/* The correct home page remains intentionally untouched below the global mast. */
#host .view.preserved-course-view{min-height:calc(100svh - 66px)}
.preserved-rail{top:66px;z-index:59}
.preserved-rail button{padding:9px 3px;font-size:8px}
.preserved-lab-hero{height:auto;min-height:570px;grid-template-columns:.82fr 1.18fr;background:var(--paper)}
.preserved-lab-poster{left:-1vw;top:0;color:var(--ink);opacity:.97;font-size:clamp(190px,25vw,385px);line-height:.72}
.preserved-lab-intro{padding:205px 0 55px 5vw;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end}

.preserved-lab-tag{left:4%;top:175px;background:var(--lime);box-shadow:4px 4px 0 rgba(17,17,17,.14)}

/* The preserved lesson copy is regrouped into wide visual stages at runtime. */
.preserved-lesson-body{max-width:none;margin:0;padding:0;background:var(--paper)}
.preserved-lesson-body::before{display:none}
.preserved-stage{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px 24px;padding:88px 5vw 100px;border-bottom:1px solid var(--ink);overflow:hidden;isolation:isolate}

.preserved-stage>*{grid-column:2/span 7;min-width:0;max-width:none}
.preserved-stage>h2,.preserved-stage>h3{grid-column:1/span 4;align-self:start;margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:clamp(38px,4.3vw,65px);line-height:.96;letter-spacing:-.035em;text-transform:uppercase}

.preserved-stage>.term{grid-column:5/-1;grid-row:1/span 12;width:100%;max-width:none;min-height:410px;margin:0 0 18px;align-self:start}
.preserved-stage>.step{grid-column:2/span 8;width:100%;max-width:none;margin:0;padding:22px 24px;border:1px solid var(--ink);background:var(--card);clip-path:none;transform:none;filter:none;box-shadow:8px 9px 0 rgba(17,17,17,.1)}
.preserved-stage>.step:nth-of-type(even){grid-column:4/span 8;margin:0;clip-path:none;transform:none}
.step .shead{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin-bottom:14px}
.step .snum{background:var(--ink);color:#fff;padding:7px 9px}
.step .stitle{font-size:14px}
.preserved-stage>.why,.preserved-stage>.warn,.preserved-stage>.goal,.preserved-stage>.scen{grid-column:3/span 8;width:100%;max-width:none;margin:12px 0;padding:20px 22px;border:1px solid var(--ink);clip-path:none;transform:none;filter:none;box-shadow:7px 8px 0 rgba(17,17,17,.1)}
.preserved-stage>.why{background:var(--blue2);border-color:var(--blue)}
.preserved-stage>.warn{background:#ffe9e8;border-color:var(--coral)}
.preserved-stage>.register-key,.preserved-stage>.lesson-principles,.preserved-stage>.hinge,.preserved-stage>.board,.preserved-stage>.dash,.preserved-stage>.finale-stats,.preserved-stage>.picker,.preserved-stage>.quiz,.preserved-stage>.ratewrap{grid-column:2/span 10;width:100%;max-width:none}
.preserved-stage>.quiz{margin:12px 0;padding:24px 26px;border:1px solid var(--ink);clip-path:none;transform:none;filter:none;box-shadow:8px 9px 0 rgba(17,17,17,.1)}
.preserved-stage>.quiz:nth-of-type(even){margin-left:0;transform:none}
.register-key,.lesson-principles{gap:0;border:1px solid var(--ink);background:var(--card)}
.register-key>div,.lesson-principles>article{border:0;border-right:1px solid var(--ink);border-radius:0;background:var(--card);padding:18px}
.register-key>div:last-child,.lesson-principles>article:last-child{border-right:0}

/* S82 terminal, decision, board, and artifact character — no green legacy UI. */

function typeLine(body,cls,text){return new Promise(res=>{
  const el=document.createElement('div');el.className='tl '+cls;body.appendChild(el);
  if(cls==='spacer'){res();return}
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=text;body.scrollTop=body.scrollHeight;res();return}
  let i=0;const cur=document.createElement('span');cur.className='cursor';el.appendChild(cur);
  const tick=()=>{if(i<text.length){el.insertBefore(document.createTextNode(text.slice(i,i+3)),cur);i+=3;body.scrollTop=body.scrollHeight;setTimeout(tick,5)}else{cur.remove();res()}};tick()})}
async function playScript(body,script){
  for(const L of script){
    if(L.t==='file'){const nb=L.body!==undefined&&L.body!==null?L.body:(OUT[L.path]!==undefined?OUT[L.path]:FILES[L.path]);setFile(L.path,nb);
      const proto=L.path.startsWith('prototypes/');
      const card=document.createElement('div');card.className='filecard'+(proto?' proto':'');card.onclick=()=>openFile(L.path);
      card.innerHTML=`<span class="fico">${proto?'▶':'📄'}</span><span>${L.path}</span><span class="fview">${proto?'OPEN PROTOTYPE ▸':'VIEW ▸'}</span>`;
      body.appendChild(card);body.scrollTop=body.scrollHeight;
      await new Promise(r=>setTimeout(r,240));continue}
    if(L.t==='fn'){L.x();continue}
    await typeLine(body,L.t,typeof L.x==='function'?L.x():(L.x||''));
    if(L.reg)regRow(L.reg[0],L.reg[1]);
    await new Promise(r=>setTimeout(r,matchMedia('(prefers-reduced-motion: reduce)').matches?0:150))}}
function wireTerm(term){
  const key=term.dataset.sim,sim=SIMS[key];
  const body=term.querySelector('.term-body'),foot=term.querySelector('.term-foot'),btn=term.querySelector('.runbtn');
  const input=term.querySelector('.suggest-in');
  btn.onclick=async()=>{btn.disabled=true;btn.textContent='Running…';
    const userText=input?input.value.trim():null;
    const cmd=typeof sim.cmd==='function'?sim.cmd(userText):sim.cmd;
    await typeLine(body,'user',cmd);
    await new Promise(r=>setTimeout(r,240));
    await playScript(body,typeof sim.script==='function'?sim.script(userText):sim.script);
    if(sim.choice){renderChoices(body,foot,btn,key,typeof sim.choice==='function'?sim.choice(userText):sim.choice)}
    else fin(key,foot,btn)}}
function renderChoices(body,foot,btn,key,choiceArr){
  const c=document.createElement('div');c.className='choices';
  choiceArr.forEach(([lab,follow],i)=>{const b=document.createElement('button');b.textContent=lab;if(i>0)b.classList.add('alt');
    b.onclick=async()=>{c.remove();await typeLine(body,'user',lab);
      const f=typeof follow==='function'?follow():follow;
      await playScript(body,f.script||f);
      if(f.choice)renderChoices(body,foot,btn,key,f.choice);else fin(key,foot,btn)};
    c.appendChild(b)});
  body.appendChild(c);body.scrollTop=body.scrollHeight}
function fin(key,foot,btn){btn.textContent='Run again';btn.disabled=false;
  const stage=foot.closest('.preserved-stage');
  if(stage){const stepButton=document.querySelector('.preserved-stage-button[data-stage-target="'+stage.id+'"]');if(stepButton)stepButton.classList.add('done')}
  if(!state.simsDone.has(key)){state.simsDone.add(key);if(TIMES[key])state.mins+=TIMES[key];
    const t=document.createElement('span');t.className='done-tag';t.textContent='✓ DONE';foot.appendChild(t);refresh()}maybeAdvanceStage(stage)}

/* ================= NOTE PARSER (for user-pasted meetings) ================= */
let seq=100;
function q(s){return '"'+s.replace(/"/g,"'")+'"'}
function parseNotes(t){
  const lines=t.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  return lines.map(ln=>{const low=ln.toLowerCase();
    if(/decid|decision|agreed|going with/.test(low))return{k:'dec',txt:ln};
    if(/\bby (mon|tue|wed|thu|fri|monday|tuesday|wednesday|thursday|friday|next |eod|tomorrow)|owns?\b|will (send|update|write|draft|share)/.test(low))return{k:'com',txt:ln};
    if(/risk|might|maybe|heard|concern|worried|unconfirmed|not sure/.test(low))return{k:'risk',txt:ln};
    return{k:'note',txt:ln}})}

 }[t]||[{t:'plain',x:'Pick a scenario above.'}])}

<p>Type <code>/</code> in the chat and the full command palette appears, each with a description. Try it:</p>
${term('help','haiku','<b>/</b>')}
<p class="note"><b>The command palette verifies which workflows exist.</b> Plain-language requests route to the same workflows. This course shows slash commands for orientation; routine use can begin with a description of the task.</p>`;

V.l1=`<div class="eyebrow">Lesson 1</div><h1>Teach it who you are — in one message</h1>${illo('l1')}

<div class="lesson-orientation"><p><code>CLAUDE.md</code> is durable context. Update it and inspect the exact diff, so future sessions start with your real area, audience, and communication style instead of relying on chat memory.</p></div>
<p>Open <code>CLAUDE.md</code> in the Workspace — three <code>[BRACKETS]</code> are unfilled. That file loads at the start of every session; those brackets are the difference between output in your voice and generic filler. In real life you fill them the same way you do everything else here: tell Claude in the chat. <b>The input below is editable — put your real area, audience, and style in before running</b> (keep the three parts separated by semicolons):</p>
${term('ctx','sonnet','set up my context: I own reporting &amp; analytics; my updates go to VP Product and eng leads; keep my writing direct and brief','line')}
<div class="why"><b>The diagnostic that never stops being true:</b> if output sounds generic, durable context is missing. Add the audience, domain constraint, example, or writing rule to <code>CLAUDE.md</code>. A cleverer one-time prompt may improve one answer; durable context improves the sessions that follow.</div>`;

V.l2=`<div class="eyebrow">Lesson 2</div><h1>Capture a decision in under a minute</h1>${illo('l2')}

<div class="lesson-orientation"><p>Capture real work quickly while keeping ambiguous statements from becoming fake decisions. The workflow sorts what you said without forcing certainty you did not provide.</p></div>
<p><code>/quick-close</code> parses a short note into decisions, commitments, risks, and raw notes without forcing certainty.</p>
<div class="register-key" aria-label="Register types"><div><b>Decisions</b>Settled choices</div><div><b>Commitments</b>An owner plus a due date</div><div><b>Risks</b>Uncertain watch items</div></div>
<p>Run the sample first to see the shape, then <b>clear the box and type a real decision or commitment from your own week</b> — it parses yours exactly the same way (decisions, commitments, and hedged "might/heard" risks each go to the right register).</p>
${term('quickclose','haiku','decided w/ Dana — Scorecards phase 1 admin-only, Jordan owns eligibility spec by Fri','line')}
<p class="note">Clear statements log instantly — internal bookkeeping never waits for approval; only things other people see do. Anything ambiguous is saved raw instead of guessed at, and gets fully reconciled at the nightly inbox run. Voice works too: dictate a 10-second memo<span data-os="mac"> (or your phone)</span><span data-os="win"> (Win+H, or your phone)</span> and drop the transcript in <code>inbox/meetings/</code>.</p>`;

V.l3=`<div class="eyebrow">Lesson 3</div><h1>Where the information comes from</h1>${illo('l3')}

<div class="lesson-orientation"><p>Choose an available ingestion path and name it honestly. The system can use approved connections, exports, pasted material, durable links, or an optional browser bridge—but it never implies access you did not grant.</p></div>
<div class="why"><b>Access is granted, not assumed.</b> An export remains a legitimate source. The important distinction is whether the system can name what it actually read.</div>
<div class="step"><div class="shead"><span class="snum">PATH 1</span><span class="stitle">Jira, Confluence, GitHub — through whatever access your company grants</span></div>
<p>Claude Code runs on <i>your</i> machine with <i>your</i> credentials. Atlassian access follows one of three company-approved paths: <b>(a)</b> an IT-enabled integration/MCP connection, <b>(b)</b> a personal API token from your Atlassian profile, or <b>(c)</b> exported files through Path 2. Access remains limited to the permissions you grant.</p></div>
<div class="step"><div class="shead"><span class="snum">PATH 2</span><span class="stitle">Export → drop in inbox/</span></div>
<p>Any tool exports CSV/PDF. Download → drag into <code>inbox/exports/</code>. Your workspace already has three seeded ones — a Jira board export, a Slack search export, a support case. Lessons 4-5 read <i>those exact files</i> and say so.</p></div>
<div class="step"><div class="shead"><span class="snum">PATH 3</span><span class="stitle">Paste from any source</span></div>
<p>Copy anything — a Slack thread, an email, a stray thought — and paste it into the chat. It gets classified, filed with a timestamp, and processed like everything else. Try it (editable — paste anything real):</p>
${term('paste','haiku','From #cs-escalations: Harbor Dental asked if scorecard exports can go to a shared drive instead of email. Second account asking this month.','area')}
<p class="note">Pasted text requires no special integration. When Cursor is closed, a one-click OS shortcut (a <span data-os="mac">macOS Quick Action in the right-click menu</span><span data-os="win">right-click "Send to" entry</span>) moves the current clipboard into <code>inbox/</code>.</p></div>
<div class="step"><div class="shead"><span class="snum">PATH 4</span><span class="stitle">The browser bridge — live reads of your logged-in tools (~15 min, once, optional)</span></div>
<p>How "reading a dashboard" becomes literal: Claude reads pages in a Chrome window <b>you're signed into</b> — read-only; clicking/typing/submitting is blocked at the permission layer.</p>
<p><b>1.</b> <code>npm install -g @playwright/mcp</code>&nbsp;&nbsp;<b>2.</b> Launch a dedicated Chrome profile (save as a shortcut):</p>
<pre class="snip"><span data-os="mac">/Applications/Google\\ Chrome.app/Contents/MacOS/Google\\ Chrome \\
  --remote-debugging-port=9222 --user-data-dir="$HOME/chrome-claude-profile"</span><span data-os="win">"C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe" ^
  --remote-debugging-port=9222 --user-data-dir="%USERPROFILE%\\chrome-claude-profile"</span></pre>
<p><b>3.</b> Log into Slack/dashboards/SharePoint in that window once — sessions persist.&nbsp;&nbsp;<b>4.</b> Create <code>.mcp.json</code> in the workbench folder:</p>
<pre class="snip">{ "mcpServers": { "browser-bridge": { "command": "npx",
  "args": ["@playwright/mcp@latest","--cdp-endpoint","http://localhost:9222"] } } }</pre>
<p><b>5.</b> Test: "using the browser-bridge, list my open tabs." Blocked by corporate policy? Paths 1-3 cover this entire course.</p></div>
<h2>Log durable links</h2>
<p>For reachable Confluence or SharePoint resources—templates, wiki pages, and dashboards—log the link once so the workflow retrieves the current source. Editable—use one of your real links:</p>
${term('links','haiku','log our PRD template link: https://lumenly.atlassian.net/wiki/spaces/PROD/pages/1123/prd-template','line')}
<div class="branch"><button onclick="markDone(this,'datain')">I know how all four paths work</button></div>`;

V.l4=`<div class="eyebrow">Lesson 4</div><h1>One meeting, every follow-through</h1>${illo('l4')}

<div class="lesson-orientation"><p>Trace decisions to the meeting source and coordinate every downstream update without relying on memory. The transcript remains the source; state compounds across workflows.</p></div>
<h3>Close out the seeded roadmap review</h3>
<p>You organized it in Teams, so the transcript exists. Open <code>inbox/meetings/2026-07-14-roadmap-review.txt</code> first, then trace every extraction to a source line. A Copilot summary or typed notes follow the same workflow.</p>
${term('closeout','sonnet','<b>/meeting-closeout</b> inbox/meetings/2026-07-14-roadmap-review.txt')}
<h3>Close out notes from your own meeting</h3>
<p>The seeded transcript proves nothing if it only works on seeded files. Paste notes from a real meeting of yours (or edit the sample) — same parsing, cumulative rows:</p>
${term('yourmeeting','sonnet','Synced with Priya. Agreed to move the analytics review to monthly.\nPriya will share the instrumentation checklist by Tuesday.\nHeard the data team might lose a contractor next quarter.','area')}
<h3>Reconcile the board with the meeting decision</h3>
${term('jira','sonnet','<b>/jira-reconcile</b>')}
<h3>Draft the weekly update</h3>
<p>Note what happens after the draft: it checks your <i>previous</i> commitments against this draft, and you can ask for format changes — which it remembers.</p>
${term('weekly','sonnet','<b>/weekly-update</b>')}
<div class="why"><b>Open the update file.</b> Every line traces to a register row or source file in the workspace, including the rows created from your pasted notes.</div>`;

V.l5=`<div class="eyebrow">Lesson 5</div><h1>Interrogate evidence, then refresh the official number</h1>${illo('l5')}

<div class="lesson-orientation"><p>Ask sourced questions across accumulated evidence, distinguish signal strength from volume, preserve unknowns as valid findings, and report a metric from its named source.</p></div>
<div class="lesson-principles"><article><b>Evidence is queryable</b><p>Claims remain connected to their sources, confidence, and sampling limits.</p></article><article><b>Unknowns are valid findings</b><p>A missing answer becomes a focused research or engineering question.</p></article></div>
<h3>Query accumulated evidence in four modes</h3>
<p>Discovery turns accumulated evidence into product decisions. Edit the box to use the same command in four modes:</p>
<ul class="note" style="margin:6px 0 10px 18px;list-style:disc">
<li><b>Ask across all evidence:</b> <i>"what do we know about export reliability?"</i> — searches everything, sourced, with confidence and sampling gaps called out</li>
<li><b>Add evidence:</b> paste an interview quote or note — it extracts and files it</li>
<li><b>See the delta:</b> <i>"what's new since last week?"</i></li>
<li><b>Map opportunities:</b> <i>"map opportunities around the Monday review"</i></li>
</ul>
${term('discovery','sonnet','what do we know about export reliability problems?','line')}
<div class="why"><b>Evidence quality:</b> strong discovery separates <i>direct evidence</i> from <i>stakeholder opinion</i> and <i>volume</i> from <i>strength</i>. Three complaints from one account represent one source. The output also records sampling gaps and unresolved questions.</div>
<h3>Metrics: the number already exists</h3>
<p>This mock dashboard contains the official value. The workflow removes the repeated work of opening several dashboards, transcribing values, and rewriting the same update. On the first run, it records the source and the approved retrieval method: browser bridge or pasted data.</p>
<div class="dash"><div class="dtitle">Lumenly Analytics · Weekly Active Admins</div><div class="dval">41.2%</div><div class="dmeta">target 45% · +1.8pp vs last week · data through Jul 15</div>
<svg width="260" height="46" viewBox="0 0 260 46"><polyline points="0,38 30,36 60,37 90,32 120,33 150,28 180,26 210,22 240,18 260,16" fill="none" stroke="#7bd8a8" stroke-width="2.5"/><line x1="0" y1="10" x2="260" y2="10" stroke="#5a6ba8" stroke-dasharray="4 4"/><text x="2" y="8" fill="#9fb0e0" font-size="9">target 45%</text></svg></div>
${term('okr','sonnet','<b>/okr-refresh</b>')}`;

V.l7=`<div class="eyebrow">Lesson 7</div><h1>Turn accumulated evidence into a PRD and working prototype</h1>${illo('l7')}

<div class="lesson-orientation"><p>Give the workbench a well-formed product brief, verify what it used, refine the PRD package, build and QA a working prototype, and resolve drift between the two.</p></div>
<p><b>A trustworthy PRD starts before drafting.</b> The workbench searches the accumulated workspace, selects evidence that supports this problem, names every source, and calls out material it deliberately excluded.</p>
<p>You bring the customer problem, intended outcome, first audience, and real scope constraints — a bare feature name gets refused. It brings everything the whole workspace has accumulated (and says what it set aside, so context is auditable). Runs on Opus automatically — the deep-reasoning model, saved for work like this.</p>
<div class="lesson-principles"><article><b>What the system does</b><p>Retrieves relevant evidence, preserves the source trace, identifies exclusions, and compiles coordinated artifacts.</p></article><article><b>Your responsibility before drafting</b><p>Confirm the evidence is relevant. Notice gaps or overconfident claims. Challenge what was included or excluded.</p></article></div>
<div class="hinge"><div class="hbox src">Evidence · strategy · current behavior</div><div class="harrow">→</div><div class="hbox contract">Feature Contract<div class="hsub">the shared spec both sides honor</div></div><div class="hforks"><span>↙</span><span>↘</span></div><div class="hbox pp">PRD ⇄ Prototype<div class="hsub">divergence is a choice, never a silent overwrite</div></div></div>
${term('prd','opus','<b>/prd-package</b> manager scorecards — problem: owners can\u2019t see per-manager performance without hand-built exports; goal: lift weekly active admins toward 45%; audience: enterprise admins first')}
<p><b>Open all three files</b> — then use the refine choices: the problem-section rewrite produces a real v2, and the edit style is remembered.</p>
<h3>The prototype — open it, click it</h3>
<p>Built from the Feature Contract: every state the contract names becomes a screen. It can be static HTML, a real React app, or an Expo mobile app — the type is chosen up front because each runs (and gets QA'd) differently; anything beyond a single throwaway screen gets scaffolded as a real git-initialized repo, ready to import to GitHub, with a home for your company's design components or style guide if you have them.</p>

<p>In real life you open <code>index.html</code> directly, or run the dev server the README names, or open the Expo web link — or share any of those in a research session. Here, the OPEN PROTOTYPE card renders the real thing:</p>
<div class="lesson-principles"><article><b>One shared definition</b><p>The Feature Contract defines scope, permissions, states, edge cases, and instrumentation once. The PRD and prototype must honor those same decisions.</p></article><article><b>Your review responsibility</b><p>Click every declared state, read the QA report, and resolve any behavior absent from the contract.</p></article></div>
${term('proto','sonnet','<b>/prototype-build</b> manager scorecards')}
<h3>What to repeat on your own work</h3>
<div class="register-key"><div><b>Ground it</b>Assemble current evidence, decisions, metrics, and templates before drafting.</div><div><b>Direct it</b>Supply the problem, goal, audience, and real constraints the system cannot infer.</div><div><b>Interrogate it</b>Open every output, test every state, inspect QA, and resolve divergence explicitly.</div></div>
<div class="why"><b>The command is the smallest part.</b> Confidence comes from knowing the sequence and the boundaries: ground → direct → inspect → decide.</div>`;

V.l8=`<div class="eyebrow">Lesson 8</div><h1>Run a research and experiment loop before committing the build</h1>${illo('l8')}

<div class="lesson-orientation"><p>Identify who is worth learning from, design research that can change a product decision, and pre-register what positive, negative, and null experiment outcomes will mean.</p></div>
<p>The system produces research criteria, a participant slate, outreach and interview materials, and an experiment package with decision rules for positive, negative, and null outcomes.</p>
<h3>Turn a feature into a research plan</h3>
<p>The internal CRM supplies participant records. This workflow builds the research plan: screening criteria with a diversity guard, an outreach strategy with drafts, and an interview guide with decision rules written <i>before</i> sessions. Edit the field to narrow the focus:</p>
${term('research','sonnet','recovery workflow after a failed export','line')}
<div class="why"><b>Participant criteria:</b> the PM defines <i>who</i> is worth learning from, <i>how</i> to reach them without leading the witness, and <i>which</i> past-behavior questions test the assumption. The CRM applies those criteria to participant records.</div>
<h3>Design the test before anyone builds anything</h3>
${term('experiment','opus','<b>/experiment-package</b> failure notifications for scheduled exports')}
<div class="why"><b>The critical line is "IF null →".</b> Every experiment must define the decision produced by a null result. The design gate blocks tests that leave the original decision unchanged.</div>`;

V.l9=`<div class="eyebrow">Lesson 9</div><h1>Keep the roadmap coherent across every surface</h1>${illo('l9')}

<div class="lesson-orientation"><p>Coordinate Jira, <code>roadmap.csv</code>, Slack, and leadership materials as one visible change set—without claiming incomplete work is done.</p></div>
<div class="lesson-principles"><article><b>One change manifest</b><p>Every intended surface is recorded as applied or explicitly pending.</p></article><article><b>Reasons remain answerable</b><p>The evidence and decision behind each change stay attached for later retrieval.</p></article></div>
<p>The roadmap spans Jira, a spreadsheet, Slack updates, and a leadership deck. Unreconciled changes create contradictions across those surfaces. This live board comes from <code>roadmap/roadmap.csv</code>:</p>
<div class="board" id="rboard">
<div class="bcol"><h5>Now</h5><div class="bcard" id="bc1">Manager Scorecards ph1<div class="bmeta">target: 2026-08 · admins</div></div></div>
<div class="bcol" id="colNext"><h5>Next</h5><div class="bcard" id="bc2">Manager Scorecards ph2<div class="bmeta">target: 2026-Q4 · per-location</div></div></div>
<div class="bcol"><h5>Later</h5><div class="bcard" id="bc3">Report scheduling v2<div class="bmeta">2027-H1</div></div></div>
</div>
<p>One input, two features — notice it splits them into separate change sets so context never blurs between initiatives, then proposes per-surface changes for each:</p>
${term('roadmap','sonnet','<b>/roadmap-update</b> scorecards ph2 slips one sprint (permissions est. now 3 wks, auth freeze); add Export Reliability to Next (case #8841, retry + failure alerts)')}
<div class="why"><b>The change manifest records completion.</b> The update is complete when every intended surface is either applied or explicitly pending. Drafts remain labeled as drafts. The reason for the slip stays attached to the decision for later retrieval.</div>`;

V.l6=`<div class="eyebrow">Lesson 6</div><h1>Understand a feature at code level with explicit confidence boundaries</h1>${illo('l6')}

<div class="lesson-orientation"><p>Use code as one source of truth, separate confirmed implementation from inference, and turn what remains unknown into focused engineering questions instead of guesses.</p></div>
<p>You have read access to the repos. This reads the relevant code and translates it into product language, with every claim tagged by confidence — the honesty that makes it safe to rely on. Editable — ask about any part of the feature:</p>
${term('codedive','sonnet','/code-dive scorecards permissions','line')}
<div class="why"><b>Confidence tags:</b> code confirms implementation. Deployment, intent, customer use, and strategic approval require additional evidence. The workflow separates confirmed behavior, inference, and focused engineering questions. Findings accumulate in the product-knowledge map for future work.</div>`;

V.l10=`<div class="eyebrow">Lesson 10</div><h1>Close delivery into strategy</h1>${illo('l10')}

<div class="lesson-orientation"><p>Reconcile launch drift, competitive changes, and strategy assumptions from current workspace state instead of rewriting strategy from memory.</p></div>
<div class="lesson-principles"><article><b>Reconcile before drafting</b><p>Current artifacts must agree—or expose where they do not—before downstream launch material is produced.</p></article><article><b>Strategy is a change report</b><p>Show what strengthened, weakened, or contradicted existing assumptions instead of starting with a blank-page essay.</p></article></div>
<h3>Catch launch drift before you write a single doc</h3>
<p>The most expensive launch bug is documents generated from sources that already disagree. This reconciles first, drafts second:</p>
${term('launch','sonnet','<b>/launch-package</b> manager scorecards')}
<h3>Compare competitors through material changes</h3>
<p>It diffs this month's captures against last month's and classifies real product changes vs. marketing rewording — then flags anything that undercuts something you're building:</p>
${term('competitive','sonnet','<b>/competitive-scan</b> reporting')}
<h3>Refresh strategy from accumulated evidence — as a change report</h3>
<p>The change report shows which assumptions strengthened, weakened, or gained contradictory evidence. Review the <b>Deep-mode usage estimate</b> before the full run; Standard mode remains available for a narrower summary:</p>
${term('strategy','opus','<b>/strategy-refresh</b> reporting')}
<h3>Recover after the workspace goes stale</h3>
${term('recover','sonnet','I haven\u2019t touched the workbench in ten days — what went stale?')}
<h3>Query accumulated state directly</h3>
<p>Accumulated state makes previous decisions, evidence, and commitments retrievable through a direct question.</p>
${term('ask','haiku','what did we decide about scorecards permissions?')}
<div class="why"><b>The loop closes here:</b> launch outcomes and competitive moves feed strategy, strategy reshapes the roadmap, the roadmap drives the next PRD. Every artifact you made in this course is a link in that chain — nothing is a dead end.</div>`;

V.l11=`<div class="eyebrow">Lesson 11</div><h1>Handle failure by stopping, naming, and reconciling</h1>${illo('l11')}

<div class="lesson-orientation"><p>Recognize incomplete or unsafe work, preserve what succeeded, and choose the correct fallback without fabricated success. Recovery is a first-class system behavior.</p></div>
<h3>Inspect a failed run</h3>
<p>Reliable failure handling follows a consistent sequence: <b>stop, identify the failure, offer the fallback, and preserve verified work.</b> Select a failure below to inspect the response.</p>
<div class="picker" id="troublePicker">
<button onclick="pickTrouble('session',this)">Browser session expired mid-run</button>
<button onclick="pickTrouble('filters',this)">Board filter can't be verified</button>
<button onclick="pickTrouble('incomplete',this)">Search came back incomplete</button>
<button onclick="pickTrouble('format',this)">Export format changed</button>
<button onclick="pickTrouble('disagree',this)">Two sources disagree</button>
<button onclick="pickTrouble('dupe',this)">Register may hold a duplicate</button>
<button onclick="pickTrouble('usage',this)">Usage limit hit mid-review</button>
<button onclick="pickTrouble('partial',this)">Jira applied, spreadsheet pending</button>
<button onclick="pickTrouble('oob',this)">Doc edited outside the workbench</button>
<button onclick="pickTrouble('drift',this)">Prototype drifted from the contract</button>
<button onclick="pickTrouble('unsourced',this)">A claim has no source</button>
<button onclick="pickTrouble('sched',this)">Scheduled run, missing inputs</button>
</div>
${term('trouble','sonnet','session','line')}
<h3>Scheduling — automate only earned workflows</h3>
<p>Once a workflow is boringly reliable by hand, you can schedule it. Four modes, and the discipline that keeps scheduling from becoming a second inbox:</p>
${term('schedule','haiku','set up scheduling for my workbench')}
<div class="why"><b>Trust model:</b> uncertainty remains labeled, failures stop visibly, and fallbacks preserve verified work. Unsupported confidence is never presented as a completed result.</div>`;

V.fin=`<div class="eyebrow">Finale</div><h1>Operate the workbench independently</h1>${illo('fin')}
<div class="lesson-orientation"><p>Select the right workflow or plain-language request, inspect the right evidence, make the judgment call, and recover safely when the system is incomplete.</p></div>
<p class="lede">Open the Workspace one last time — every ● updated file and register row came from the last 40 minutes, and Lesson 10 answered a question purely from them. That accumulation is the entire idea.</p>
<div class="finale-stats"><div class="fstat"><div class="fv" id="stRows">0</div><div class="fl">register rows created</div></div>
<div class="fstat"><div class="fv" id="stMins">0h</div><div class="fl">est. manual work replaced — retyping &amp; reconciling, not judgment</div></div>
<div class="fstat"><div class="fv" id="stFiles">0</div><div class="fl">documents &amp; prototypes produced, all inspectable</div></div></div>

<button data-r="0">/prd-package — assume the implementation without inspecting the code</button>

<div class="quiz" data-q="4"><p class="q">4 · Mid-way through a big PRD, you hit your usage limit. How much work did you lose?</p><div class="qopts">

<div class="quiz" data-q="5"><p class="q">5 · An output reads "customers love the new flow," with no supporting evidence. What should happen?</p><div class="qopts">

<button data-r="0">Accept it without inspecting the sources</button>

<button onclick="rateReady(1)">Reference needed</button>

<div class="why" id="homework" style="display:none"><b>Week-one target:</b> build fluency with the daily loop: <code>/quick-close</code>, <code>/meeting-closeout</code>, and <code>/weekly-update</code>. Use the remaining workflows when their situations arise. <b>Next action:</b> run <code>/meeting-closeout</code> after your next real meeting. The same operating pattern—capture, reconcile, produce—extends across the course.</div>`;
